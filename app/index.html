<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طرف الخيط — بروتوتايب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --maroon:#6B1E22; --maroon-dark:#4E1519; --maroon-light:#F3E4E4; --maroon-mid:#8B2E32;
  --olive:#4A4A30; --olive-light:#EEEEE2; --olive-mid:#6B6B45;
  --cream:#F5EFE6; --cream-soft:#FAF6EF; --card:#FFFFFF;
  --ink:#34322E; --ink-soft:#6B675E; --muted:#948F82; --border:#E7E0D3;
  --success:#3C6B3F; --success-bg:#E4EDE3;
  --warning:#9C6B1F; --warning-bg:#F5EAD3;
  --danger:#8B2E2E; --danger-bg:#F5E1DF;
  --info:#3B5566; --info-bg:#E4EBEE;
  --paused:#6B675E; --paused-bg:#EDEAE2;
  --shadow: 0 10px 30px -10px rgba(60,40,20,0.18);
  --shadow-sm: 0 4px 14px -6px rgba(60,40,20,0.14);
  --r:14px;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0; background:var(--cream); color:var(--ink); font-family:'Cairo',system-ui,sans-serif;}
button, input, select, textarea{font-family:inherit;}
a{color:var(--maroon); text-decoration:none;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:#D9CFBB; border-radius:10px;}

.app-shell{min-height:100vh; display:flex; flex-direction:column;}
.btn{display:inline-flex; align-items:center; gap:7px; border:none; border-radius:10px; padding:10px 18px; font-size:13.5px; font-weight:700; cursor:pointer; transition:.15s; font-family:inherit;}
.btn-maroon{background:var(--maroon); color:#fff;}
.btn-maroon:hover{background:var(--maroon-dark);}
.btn-outline{background:#fff; color:var(--maroon); border:1.5px solid var(--maroon);}
.btn-outline:hover{background:var(--maroon-light);}
.btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--border);}
.btn-ghost:hover{background:var(--cream-soft);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-sm{padding:7px 13px; font-size:12.5px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-block{width:100%; justify-content:center;}
.icon-btn{width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
.icon-btn:hover{background:var(--cream-soft); color:var(--maroon);}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow-sm);}
.card-pad{padding:18px 20px;}
.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:700;}
.badge-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

input:not([type]), input[type=text], input[type=password], input[type=number], input[type=email], select, textarea{
  width:100%; padding:10px 13px; border:1.5px solid var(--border); border-radius:9px; font-size:13.5px; color:var(--ink); background:#fff; outline:none;
}
input:focus, select:focus, textarea:focus{border-color:var(--maroon);}
textarea{resize:vertical; min-height:70px;}
label.field-label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
.field{margin-bottom:14px;}
.checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); cursor:pointer;}

.topbar{background:var(--maroon); color:#fff; position:sticky; top:0; z-index:40; box-shadow:0 2px 14px rgba(0,0,0,.12);}
.topbar-inner{max-width:1360px; margin:0 auto; display:flex; align-items:center; gap:20px; padding:11px 24px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand img{width:34px; height:34px; border-radius:8px;}
.brand-text{font-weight:800; font-size:18px; line-height:1;}
.brand-text small{display:block; font-weight:500; font-size:10.5px; color:#E8D4D5; margin-top:3px;}
.topbar-spacer{flex:1;}
.topbar-user{display:flex; align-items:center; gap:10px;}
.av{width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;}
.role-switch{display:flex; gap:4px; background:rgba(255,255,255,.12); border-radius:10px; padding:3px;}
.role-switch button{background:none; border:none; color:#EFD9DA; font-family:inherit; font-size:12.5px; font-weight:700; padding:7px 13px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px;}
.role-switch button.active{background:#fff; color:var(--maroon);}

.subnav{background:#fff; border-bottom:1px solid var(--border);}
.subnav-inner{max-width:1360px; margin:0 auto; display:flex; gap:4px; padding:0 24px;}
.subnav-inner button{background:none; border:none; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink-soft); padding:13px 15px; border-bottom:2.5px solid transparent; cursor:pointer; display:flex; align-items:center; gap:7px;}
.subnav-inner button.active{color:var(--maroon); border-color:var(--maroon);}

.page{max-width:1360px; margin:0 auto; padding:26px 24px 60px;}
.shell-with-sidebar{max-width:1360px; margin:0 auto; display:flex; gap:0; align-items:flex-start;}
.sidebar{width:230px; flex-shrink:0; background:#fff; border-left:1px solid var(--border); min-height:calc(100vh - 58px); padding:20px 14px;}
.sidebar-nav button{width:100%; text-align:right; background:none; border:none; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink-soft); padding:11px 13px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:10px; margin-bottom:2px;}
.sidebar-nav button.active{background:var(--maroon); color:#fff;}
.sidebar-nav button:not(.active):hover{background:var(--cream-soft);}
.sidebar-nav .count{margin-right:auto; background:var(--maroon-light); color:var(--maroon); font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:999px;}
.sidebar-nav button.active .count{background:rgba(255,255,255,.25); color:#fff;}
.main-with-sidebar{flex:1; min-width:0; padding:24px 28px 60px;}

.section-title{font-family:'Cairo',sans-serif; font-size:23px; font-weight:800; color:var(--ink); margin:0 0 4px;}
.section-sub{font-size:13.5px; color:var(--ink-soft); margin-bottom:0;}
.eyebrow{font-size:12px; font-weight:800; color:var(--maroon); letter-spacing:.3px;}

.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media (max-width:900px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:repeat(2,1fr);}}

.stat-tile{background:#fff; border:1px solid var(--border); border-radius:var(--r); padding:16px 18px; box-shadow:var(--shadow-sm);}
.stat-tile .num{font-size:26px; font-weight:800; color:var(--ink); font-family:'Cairo',sans-serif;}
.stat-tile .lbl{font-size:12px; font-weight:700; color:var(--ink-soft); margin-top:3px; display:flex; align-items:center; gap:6px;}

.svc-icon-card{background:#fff; border:1px solid var(--border); border-radius:var(--r); padding:16px 14px; text-align:center; cursor:pointer; transition:.15s;}
.svc-icon-card:hover{border-color:var(--maroon); box-shadow:var(--shadow-sm); transform:translateY(-2px);}
.svc-icon-card .ic{width:46px; height:46px; border-radius:12px; background:var(--maroon-light); color:var(--maroon); display:flex; align-items:center; justify-content:center; margin:0 auto 10px;}
.svc-icon-card .t{font-size:12.5px; font-weight:700; color:var(--ink);}

.table{width:100%; border-collapse:collapse;}
.table th{text-align:right; font-size:11.5px; font-weight:800; color:var(--muted); padding:9px 12px; border-bottom:1.5px solid var(--border); white-space:nowrap;}
.table td{padding:12px; font-size:13px; border-bottom:1px solid var(--border); vertical-align:middle;}
.table tr:last-child td{border-bottom:none;}
.table tr:hover td{background:var(--cream-soft);}

.modal-overlay{position:fixed; inset:0; background:rgba(52,50,46,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:#fff; border-radius:16px; max-width:640px; width:100%; max-height:88vh; overflow:auto; box-shadow:0 30px 60px rgba(0,0,0,.3);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-body{padding:22px;}

.thread-line{position:relative; display:flex; justify-content:space-between; align-items:flex-start; padding:0 6px;}
.thread-line .rail{position:absolute; top:19px; right:8%; left:8%; height:3px; background:repeating-linear-gradient(to left,var(--border) 0 8px, transparent 8px 14px); z-index:0;}
.thread-node{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px; width:120px;}
.thread-node .dot{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; border:2.5px solid var(--border); color:var(--muted); flex-shrink:0;}
.thread-node.done .dot{background:var(--olive); border-color:var(--olive); color:#fff;}
.thread-node.current .dot{background:var(--maroon); border-color:var(--maroon); color:#fff; width:44px; height:44px; box-shadow:0 0 0 6px var(--maroon-light);}
.thread-node.paused .dot{background:#fff; border:2.5px dashed var(--paused); color:var(--paused);}
.thread-node.overdue .dot{background:var(--danger); border-color:var(--danger); color:#fff; animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(139,46,46,.35);} 50%{box-shadow:0 0 0 8px rgba(139,46,46,0);}}
.thread-node .lbl{font-size:11.5px; font-weight:700; text-align:center; color:var(--ink-soft); line-height:1.35;}
.thread-node.current .lbl, .thread-node.done .lbl{color:var(--ink);}

.bar-row{margin-bottom:12px;}
.bar-row .top{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px;}
.bar-row .track{height:9px; border-radius:5px; background:var(--cream-soft); overflow:hidden;}
.bar-row .fill{height:100%; border-radius:5px; background:var(--maroon);}

.dev-tool{display:flex; align-items:center; gap:8px; background:var(--cream-soft); border:1px dashed var(--border); border-radius:9px; padding:9px 13px; font-size:11.5px; color:var(--ink-soft);}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 22px; border-radius:11px; font-size:13.5px; font-weight:700; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,.25); display:flex; align-items:center; gap:9px;}
.toast.warn{background:var(--warning);}
.toast.success{background:var(--success);}

.hero-panel{background:linear-gradient(135deg,#fff 0%,var(--cream-soft) 100%); border:1px solid var(--border); border-radius:20px; padding:34px 36px; position:relative; overflow:hidden;}
.sim-stepper{display:flex; align-items:center; justify-content:center; gap:10px; margin:18px 0 30px;}
.sim-stepper .seg{flex:1; height:7px; border-radius:5px; background:var(--border); max-width:120px;}
.sim-stepper .seg.done{background:var(--olive);}
.sim-stepper .seg.current{background:var(--maroon);}
.sim-col{background:#fff; border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:var(--shadow-sm); display:flex; flex-direction:column;}
.sim-col-head{padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;}
.sim-col-body{padding:16px; flex:1;}

.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
@media (max-width:760px){.row2,.row3{grid-template-columns:1fr;}}
@media (max-width:820px){.auth-illustration{display:none !important;}}

/* ===== توحيد المحاذاة: كل الصفحات تبدأ من نفس الحافة وبنفس الترويسة ===== */
.page, .shell-with-sidebar{width:100%;}
.page-head{margin-bottom:22px;}
.page-head .back-btn{margin-bottom:14px;}
.page-head-row{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;}
.page-head-text{min-width:0; flex:1 1 320px;}
.page-head-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.section-title{margin:0 0 4px;}
.section-row{display:flex; justify-content:space-between; align-items:center; gap:12px; margin:0 0 12px;}
.sub-title{font-size:15.5px; font-weight:800; margin:0; color:var(--ink);}
.layout-split{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; align-items:start;}
@media (max-width:1080px){.layout-split{grid-template-columns:minmax(0,1fr);}}
.stack{display:flex; flex-direction:column; gap:16px; min-width:0;}
.card-title{font-weight:800; font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:8px; color:var(--ink);}
.kv{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; font-size:13px;}
.kv + .kv{border-top:1px solid var(--border);}
.kv .k{color:var(--ink-soft);}
.kv .v{font-weight:700; text-align:left;}
.chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.table-wrap{overflow-x:auto;}
.card.table-wrap{padding:0;}
.muted{color:var(--muted);}
.clickable{cursor:pointer; transition:.15s;}
.clickable:hover{border-color:var(--maroon); transform:translateY(-1px);}
.icon-square{width:40px; height:40px; border-radius:11px; background:var(--maroon-light); color:var(--maroon); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.hint-box{font-size:12.5px; background:var(--cream-soft); border:1px dashed var(--border); border-radius:10px; padding:10px 12px; margin-bottom:14px; color:var(--ink-soft);}
.note-row{padding:10px 0;}
.note-row + .note-row{border-top:1px solid var(--border);}
.list-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 6px; border-radius:9px; cursor:pointer; font-size:12.5px;}
.list-row:hover{background:var(--cream-soft);}
.progress{height:8px; border-radius:5px; background:var(--cream-soft); overflow:hidden;}
.progress > div{height:100%; border-radius:5px;}
.modal-foot{display:flex; justify-content:space-between; gap:10px; margin-top:8px; padding-top:16px; border-top:1px solid var(--border);}
.stat-tile.danger{border-color:var(--danger);}
.stat-tile.danger .num, .stat-tile.danger .lbl{color:var(--danger);}
.card-danger{border-color:#e3bdb8;}
.alert-card{border-color:#e3bdb8; background:linear-gradient(0deg,#fff,#fff), var(--danger-bg); box-shadow:0 0 0 3px var(--danger-bg);}
.table tr.row-alert td{background:#FDF6F5;}
.accordion-head{width:100%; display:flex; align-items:center; gap:12px; background:none; border:none; font-family:inherit; font-size:14px; font-weight:800; color:var(--ink); padding:14px 18px; cursor:pointer;}
.mini-stats > div{background:var(--cream-soft); border-radius:10px; padding:10px 12px;}
.mini-stats .n{font-weight:800; font-size:16px;}
.mini-stats .l{font-size:11px; color:var(--muted); font-weight:700;}
.av.sm{width:30px; height:30px; font-size:12px; background:var(--maroon-light); color:var(--maroon);}
.count-pill{background:var(--maroon); color:#fff; font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:999px;}
.sidebar-nav .count.danger{background:var(--danger); color:#fff;}
.sidebar{display:flex; flex-direction:column; gap:16px; position:sticky; top:58px;}
.sidebar-card{margin-top:auto; background:var(--cream-soft); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:12.5px;}
.main-with-sidebar{padding:26px 28px 60px;}
.icon-btn:disabled{opacity:.4; cursor:not-allowed;}
.stars{display:flex; gap:4px;}
.star-btn{background:none; border:none; cursor:pointer; padding:0;}

/* ===== البانرات ===== */
.banner{display:flex; align-items:center; gap:12px; padding:13px 18px; border-radius:var(--r); border:1px solid; margin-bottom:16px; font-size:13px; font-weight:700;}
.banner .grow{flex:1; min-width:0; line-height:1.7;}
.banner.success{background:var(--success-bg); border-color:#c5d8c3; color:var(--success);}
.banner.danger{background:var(--danger-bg); border-color:#e3bdb8; color:var(--danger);}
.banner.paused{background:var(--paused-bg); border-color:#d9d4c8; color:var(--ink);}
.banner.info{background:var(--cream-soft); border-color:var(--border); color:var(--ink);}

/* ===== الإشعارات ===== */
.notif-wrap{position:relative;}
.topbar .icon-btn.topbar-icon{background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.25); color:#fff; position:relative;}
.notif-count{position:absolute; top:-7px; left:-7px; min-width:19px; height:19px; border-radius:10px; background:#E9B44C; color:var(--ink); font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 5px; border:2px solid var(--maroon);}
.notif-panel{position:absolute; top:44px; left:0; width:370px; max-width:calc(100vw - 30px); background:#fff; color:var(--ink); border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,.25); border:1px solid var(--border); overflow:hidden; z-index:60;}
.notif-head{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); font-size:14px;}
.notif-list{max-height:430px; overflow:auto;}
.notif-item{display:flex; gap:10px; padding:12px 16px; cursor:pointer; align-items:flex-start;}
.notif-item + .notif-item{border-top:1px solid var(--border);}
.notif-item:hover{background:var(--cream-soft);}
.notif-item.unread{background:#FCF7F0;}
.notif-item.unread .notif-title::before{content:''; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--maroon); margin-left:6px; vertical-align:middle;}
.notif-ic{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.notif-title{font-size:13px; font-weight:800;}
.notif-text{font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.6;}
.notif-meta{font-size:10.5px; color:var(--muted); margin-top:4px;}
.notif-empty{padding:30px; text-align:center; color:var(--muted); font-size:13px;}
.link-btn{background:none; border:none; color:var(--maroon); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; padding:0;}

/* ===== الجدول الزمني للمسار ===== */
.timeline{display:flex; flex-direction:column;}
.tl-row{display:flex; gap:12px; position:relative; padding-bottom:16px;}
.tl-row:last-child{padding-bottom:0;}
.tl-row:not(:last-child)::after{content:''; position:absolute; right:13px; top:30px; bottom:2px; width:2px; background:var(--border);}
.tl-row.done:not(:last-child)::after{background:var(--olive);}
.tl-dot{width:28px; height:28px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:2px solid var(--border); background:#fff; color:var(--muted); font-size:11.5px; font-weight:800; z-index:1;}
.tl-row.done .tl-dot{background:var(--olive); border-color:var(--olive); color:#fff;}
.tl-row.current .tl-dot{background:var(--maroon); border-color:var(--maroon); color:#fff;}
.tl-row.overdue .tl-dot{background:var(--danger); border-color:var(--danger); color:#fff;}
.tl-row.paused .tl-dot{border-style:dashed; border-color:var(--paused); color:var(--paused);}
.tl-body{flex:1; min-width:0; padding-top:3px;}
.tl-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px;}
.tl-dept{font-size:11.5px; color:var(--muted); font-weight:700;}
.tl-meta{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
.tl-note{font-size:12px; margin-top:6px; background:var(--paused-bg); padding:7px 10px; border-radius:8px;}
.thread-line{min-width:max-content;}

/* ===== مفتاح التبديل ===== */
.toggle-row{display:flex; justify-content:space-between; align-items:center; gap:14px; padding:11px 0;}
.toggle-row + .toggle-row{border-top:1px solid var(--border);}
.switch{width:42px; height:24px; border-radius:12px; background:var(--border); position:relative; cursor:pointer; flex-shrink:0; border:none; transition:.15s; padding:0;}
.switch::after{content:''; position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on{background:var(--olive);}
.switch.on::after{right:21px;}

/* ===== باني مسار الخدمة ===== */
.route-head, .route-row{display:grid; grid-template-columns:34px minmax(140px,1fr) minmax(170px,1.5fr) 96px 118px; gap:10px; align-items:center;}
.route-head{font-size:11px; font-weight:800; color:var(--muted); padding:0 12px 6px;}
.route-row{padding:10px 12px; border:1px solid var(--border); border-radius:11px; background:#fff; margin-bottom:8px;}
.route-row.locked{background:var(--cream-soft);}
.route-num{width:28px; height:28px; border-radius:50%; background:var(--maroon); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;}
.route-row.locked .route-num{background:var(--olive);}
.route-actions{display:flex; gap:4px;}
@media (max-width:900px){.route-head{display:none;} .route-row{grid-template-columns:34px 1fr;} .route-row > *:nth-child(n+3){grid-column:2;}}
.route-chips{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
.route-chip{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--cream-soft); border:1px solid var(--border); color:var(--ink-soft); white-space:nowrap;}
.tag{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:8px; background:var(--cream-soft); border:1px solid var(--border); font-size:12.5px; font-weight:600;}
.tag button{background:none; border:none; cursor:pointer; color:var(--muted); padding:0; display:flex;}
@media (max-width:900px){.shell-with-sidebar{flex-direction:column; align-items:stretch;} .main-with-sidebar{width:100%;} .sidebar{width:100%; min-height:0; position:static; border-left:none; border-bottom:1px solid var(--border);} .sidebar-nav{display:flex; flex-wrap:wrap; gap:4px;} .sidebar-nav button{width:auto;} .sidebar-card{display:none;} .main-with-sidebar{padding:20px 16px 50px;}}
@media (max-width:760px){
  .topbar-inner{gap:8px; padding:9px 12px;}
  .brand-text{font-size:16px;} .brand-text small{display:none;}
  .topbar-user > div:not(.av){display:none !important;}
  .dev-tool button{white-space:nowrap;}
  .dev-tool{padding:6px 8px;} .dev-tool > span{display:none;}
  .subnav-inner{overflow-x:auto; padding:0 8px;} .subnav-inner button{white-space:nowrap; flex-shrink:0; padding:12px 11px;}
  .page{padding:18px 14px 50px;}
  .hero-panel{padding:22px 20px;}
  .hero-panel h1{font-size:25px !important;}
  .notif-panel{position:fixed; top:58px; left:10px; right:10px; width:auto; max-width:none;}
  .page-head-actions{width:100%;}
  .page-head-actions > div[style]{width:100% !important;}
  .section-title{font-size:20px;}
  .modal-body{padding:16px;}
}
</style>

// build full step chain: pubserv (استلام) + service.steps + pubserv (تسليم), each with role/duration
function buildServiceSteps(svc){
  const middle = svc.steps.map(d=>({department:d, citizenLabel: STEP_LABELS[d]||('معالجة لدى '+deptName(d))}));
  const chain = [{department:'pubserv', citizenLabel:'استلام الطلب'}, ...middle, {department:'pubserv', citizenLabel:'تسليم المواطن'}];
  const totalHours = Math.max(svc.days,1)*24;
  const per = Math.max(4, Math.round(totalHours/chain.length));
  return chain.map((s,i)=>({...s, role: (EMPLOYEES.find(e=>e.department===s.department)||{}).role || '', maxDurationHours: i===0||i===chain.length-1 ? Math.max(4,Math.round(per*0.6)) : per}));
}
const STEP_LABELS = {
  collections:'فحص الديون والرسوم', crafts:'فحص لدى الحرف والصناعات', eng:'فحص هندسي',
  accounts:'مراجعة حسابات', water:'معالجة لدى قسم المياه', health:'معاينة ميدانية', mgmt:'اعتماد المدير',
};
SERVICES.forEach(s=>{ s.stepChain = buildServiceSteps(s); s.durationLabel = fmtDuration(s.stepChain.reduce((a,b)=>a+b.maxDurationHours,0)); });

// ===================== CUSTOM SERVICES (يضيفها مدير البلدية ويحدد مسارها) =====================
const BASE_SERVICE_COUNT = SERVICES.length;
const DEFAULT_SETTINGS = {escalationFactor:1.6, notifyReady:true, notifyMoves:true, notifyPause:true, smsCopy:true};
let SETTINGS = {...DEFAULT_SETTINGS};
function applySettings(s){ SETTINGS = {...DEFAULT_SETTINGS, ...(s||{})}; }

function buildCustomStepChain(def){
  const first = {department:'pubserv', citizenLabel:'استلام الطلب', maxDurationHours: Math.max(1, Number(def.intakeHours)||4)};
  const last  = {department:'pubserv', citizenLabel:'تسليم المواطن', maxDurationHours: Math.max(1, Number(def.deliveryHours)||4)};
  const middle = (def.route||[]).map(r=>({
    department:r.department,
    citizenLabel:(r.label||'').trim() || STEP_LABELS[r.department] || ('معالجة لدى '+deptName(r.department)),
    maxDurationHours: Math.max(1, Number(r.hours)||24)
  }));
  return [first, ...middle, last].map(s=>({...s, role:(EMPLOYEES.find(e=>e.department===s.department)||{}).role||''}));
}
function materializeService(def){
  const stepChain = buildCustomStepChain(def);
  const totalH = stepChain.reduce((a,b)=>a+b.maxDurationHours,0);
  return {...def, custom:true, steps:(def.route||[]).map(r=>r.department), stepChain,
    days:Math.max(1, Math.round(totalH/24)), durationLabel:fmtDuration(totalH)};
}
let APPLIED_CUSTOM_JSON = '[]';
function applyCustomServices(defs){
  const json = JSON.stringify(defs||[]);
  if(json===APPLIED_CUSTOM_JSON) return;
  APPLIED_CUSTOM_JSON = json;
  SERVICES.splice(BASE_SERVICE_COUNT);
  (defs||[]).forEach(d=>SERVICES.push(materializeService(d)));
}
function isServiceActive(s){ return s && s.active!==false; }
function findService(id){ return SERVICES.find(s=>s.id===id); }
function svcName(id){ const s=findService(id); return s?s.name:'خدمة'; }

function buildStages(svc, startAtIdx, startedAgoMs){
  return svc.stepChain.map((st,i)=>{
    if(i<startAtIdx) return {...st, status:'done', startedAt:NOW-startedAgoMs-((svc.stepChain.length-i))*HOUR, endedAt:NOW-startedAgoMs};
    if(i===startAtIdx) return {...st, status:'current', startedAt:NOW-startedAgoMs, endedAt:null};
    return {...st, status:'pending', startedAt:null, endedAt:null};
  });
}

// ===================== DERIVED LOGIC =====================
function activeStageIndex(app){ return app.stages.findIndex(s=>s.status==='current'); }
function isStageOverdue(app, simNow){
  const st = app.stages[activeStageIndex(app)];
  if(!st || st.status!=='current' || app.status==='on_hold') return false;
  return (simNow - st.startedAt) > st.maxDurationHours*HOUR;
}
function isStageEscalated(app, simNow){
  const st = app.stages[activeStageIndex(app)];
  if(!st || st.status!=='current' || app.status==='on_hold') return false;
  return (simNow - st.startedAt) > st.maxDurationHours*HOUR*SETTINGS.escalationFactor;
}
function timeRemainingLabel(app, simNow){
  const st = app.stages[activeStageIndex(app)];
  if(!st || app.status==='on_hold') return null;
  const remainMs = st.maxDurationHours*HOUR - (simNow - st.startedAt);
  if(remainMs <= 0) return {overdue:true, label:'تجاوز المدة بـ '+fmtDuration(Math.abs(remainMs)/HOUR)};
  return {overdue:false, label:'متبقٍ '+fmtDuration(remainMs/HOUR)};
}

          newN.push(notif(cKey,'delivered','تم تسليم معاملتك','«'+nm+'» #'+a.reqNumber+' اكتملت وتم تسليمها. شكرًا لتعاملك مع البلدية.', a.id, at, citizenChannels(S)));
        } else if(idx+1===a.stages.length-1){
          outcome = 'ready';
          if(S.notifyReady) newN.push(notif(cKey,'ready','معاملتك جاهزة للاستلام','«'+nm+'» #'+a.reqNumber+' أُنجزت — تفضّل لاستلامها من خدمات الجمهور، بدون ما تحتاج تفتح المعاملة.', a.id, at, citizenChannels(S)));
          newN.push(notif('dept:pubserv','new_task','معاملة جاهزة للتسليم', nm+' #'+a.reqNumber+' — بانتظار تسليمها للمواطن.', a.id, at));
        } else {
          const next = a.stages[idx+1];
          if(S.notifyMoves) newN.push(notif(cKey,'moved','تقدّمت معاملتك','«'+nm+'» انتقلت إلى «'+next.citizenLabel+'» لدى '+deptName(next.department)+'.', a.id, at));
          newN.push(notif('dept:'+next.department,'new_task','معاملة جديدة وصلت دائرتك', nm+' #'+a.reqNumber+' — '+next.citizenLabel+'.', a.id, at));
        }
        if(a.delayAlert && !a.delayAlert.resolved) newN.push(notif('manager','reply','تحرّكت معاملة منبَّه عليها', nm+' #'+a.reqNumber+' انتقلت من '+deptName(a.stages[idx].department)+' بعد تنبيهك.', a.id, at));
        return {...a, stages, status: isLast?'delivered':'in_progress', delayAlert:null, deliveredAt: isLast?at:(a.deliveredAt||null)};
      });
      const msg = outcome==='delivered' ? 'تم تسليم المعاملة — وصل المواطن إشعار فوري.'
        : outcome==='ready' ? 'المعاملة جاهزة — تم إشعار المواطن تلقائيًا ليستلمها.' : 'تم تمرير المعاملة للمرحلة التالية.';
      return {...state, applications, notifications:[...newN, ...state.notifications], toast:{type:'success', msg}};
    }
    case 'RATE_APP': {
      return {...state, applications: state.applications.map(a=> a.id===action.appId ? {...a, rated:true, rating:action.rating, ratingComment:action.comment||''} : a),
        toast:{type:'success', msg:'شكرًا لتقييمك — بيوصل مباشرة للإدارة.'}};
    }
    case 'SAVE_SERVICE': {
      const exists = state.customServices.some(s=>s.id===action.service.id);
      const customServices = exists ? state.customServices.map(s=>s.id===action.service.id?action.service:s) : [...state.customServices, action.service];
      return {...state, customServices, toast:{type:'success', msg: action.service.active===false ? 'تم حفظ الخدمة كمسودة.' : (exists?'تم تحديث الخدمة ومسارها.':'تم نشر الخدمة الجديدة — صارت متاحة للمواطنين.')}};
    }
    case 'TOGGLE_SERVICE': {
      const customServices = state.customServices.map(s=>s.id===action.id?{...s, active:s.active===false}:s);
      const now = customServices.find(s=>s.id===action.id);
      return {...state, customServices, toast:{type:'success', msg: now && now.active!==false ? 'تم نشر الخدمة للمواطنين.' : 'تم إيقاف الخدمة عن المواطنين.'}};
    }
    case 'DELETE_SERVICE': {
      if(state.applications.some(a=>a.serviceId===action.id)) return {...state, toast:{type:'warn', msg:'لا يمكن حذف خدمة عليها معاملات — أوقفيها بدلًا من الحذف.'}};
      return {...state, customServices:state.customServices.filter(s=>s.id!==action.id), toast:{type:'success', msg:'تم حذف الخدمة.'}};
    }
    case 'UPDATE_SETTINGS': return {...state, settings:{...state.settings, ...action.patch}, toast:{type:'success', msg:'تم حفظ الإعدادات.'}};
    case 'RESET_DEMO': {
      const d = freshDemoData();
      return {...state, applications:d.applications, simOffset:0, customServices:[], notifications:d.notifications, settings:d.settings, focusAppId:null,
        toast:{type:'success', msg:'تمت إعادة ضبط بيانات العرض.'}};
    }
    default: return state;
  }
}

function StageTimeline({app, simNow, showOwner}){
  return (
    <div className="timeline">
      {app.stages.map((s,i)=>{
        let cls = 'pending';
        if(s.status==='done') cls='done';
        else if(s.status==='current') cls = s.pausedAt ? 'paused' : ((simNow-s.startedAt) > s.maxDurationHours*HOUR ? 'overdue' : 'current');
        const owner = employeeInDept(s.department);
        const elapsed = s.status==='done' && s.startedAt && s.endedAt ? (s.endedAt-s.startedAt)/HOUR
          : (s.status==='current' && s.startedAt && !s.pausedAt ? (simNow-s.startedAt)/HOUR : null);
        const late = s.status==='done' && elapsed!=null && elapsed > s.maxDurationHours;
        return (
          <div key={i} className={'tl-row '+cls}>
            <div className="tl-dot">
              {cls==='done' ? <Icon name="check" size={14}/> : cls==='paused' ? <Icon name="pause" size={12}/> : cls==='overdue' ? <Icon name="alert" size={13}/> : toAr(i+1)}
            </div>
            <div className="tl-body">
              <div className="tl-top">
                <b>{s.citizenLabel}</b><span className="tl-dept">{deptName(s.department)}</span>
                {cls==='current' && <span className="badge" style={{color:'var(--maroon)',background:'var(--maroon-light)',fontSize:10.5}}>المرحلة الحالية</span>}
                {cls==='overdue' && <span className="badge" style={{color:'var(--danger)',background:'var(--danger-bg)',fontSize:10.5}}>متجاوزة للمدة</span>}
                {cls==='paused' && <span className="badge" style={{color:'var(--paused)',background:'var(--paused-bg)',fontSize:10.5}}>الساعة متوقفة</span>}
                {late && <span className="badge" style={{color:'var(--warning)',background:'var(--warning-bg)',fontSize:10.5}}>أُنجزت متأخرة</span>}
              </div>
              <div className="tl-meta">
                {showOwner && owner ? owner.name+' · ' : ''}المدة المسموحة {fmtDuration(s.maxDurationHours)}
                {elapsed!=null && (s.status==='done' ? ' · استغرقت '+fmtDuration(elapsed) : ' · مضى '+fmtDuration(elapsed))}
                {s.endedAt ? ' · '+fmtDateTime(s.endedAt) : ''}
              </div>
              {s.pausedAt && <div className="tl-note"><b>سبب التوقف:</b> {s.pauseReason}</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function NotificationBell(){
  const {state, dispatch} = useStore();
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const key = userKey(state.auth);
  const mine = state.notifications.filter(n=>n.to===key);
  const unread = mine.filter(n=>!n.read).length;
  useEffect(()=>{
    function h(e){ if(ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', h);
    return ()=>document.removeEventListener('mousedown', h);
  },[]);
  return (
    <div className="notif-wrap" ref={ref}>
      <button className="icon-btn topbar-icon" onClick={()=>setOpen(o=>!o)} title="الإشعارات">
        <Icon name="bell" size={16}/>{unread>0 && <span className="notif-count">{toAr(unread)}</span>}
      </button>
      {open && (
        <div className="notif-panel">
          <div className="notif-head"><b>الإشعارات</b>{unread>0 && <button className="link-btn" onClick={()=>dispatch({type:'MARK_NOTIFS_READ', key})}>تعليم الكل كمقروء</button>}</div>
          <div className="notif-list">
            {mine.length===0 ? <div className="notif-empty">لا توجد إشعارات بعد.</div> :
              mine.slice(0,40).map(n=>(
                <NotifItem key={n.id} n={n} onClick={()=>{ dispatch({type:'MARK_NOTIF_READ', id:n.id}); if(n.appId) dispatch({type:'OPEN_APP', appId:n.appId}); setOpen(false); }}/>
              ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ===================== CITIZEN APP =====================
const QUICK_LINKS = [
  {label:'خدمات الأراضي', icon:'building', category:'eng'},
  {label:'شكاوى ومقترحات', icon:'message', category:'health'},
  {label:'الضرائب والرسوم', icon:'bank', category:'certs'},
  {label:'شهادات وتصديقات', icon:'award', category:'certs'},
  {label:'رخص البناء', icon:'fileCheck', category:'eng'},
];

function CitizenApp(){
  const {state} = useStore();
  const [tab, setTab] = useState('home');
  const [categoryFilter, setCategoryFilter] = useState(null);
  const [selectedSvc, setSelectedSvc] = useState(null);
  const [selectedAppId, setSelectedAppId] = useState(null);
  const [requestingSvc, setRequestingSvc] = useState(null);
  useFocusApp(setSelectedAppId);
  const simNow = Date.now()+state.simOffset;
  const citizen = state.citizens.find(c=>c.id===state.auth.userId);
  const myApps = state.applications.filter(a=>a.citizenId===state.auth.userId);
  const selectedApp = selectedAppId ? state.applications.find(a=>a.id===selectedAppId && a.citizenId===state.auth.userId) : null;
  const myNotifs = state.notifications.filter(n=>n.to==='citizen:'+state.auth.userId);
  const unread = myNotifs.filter(n=>!n.read).length;

  const tabs = [
    {key:'home', label:'الرئيسية', icon:'home'},
    {key:'track', label:'تتبع معاملاتي', icon:'clipboard'},
    {key:'catalog', label:'خدمات البلدية', icon:'grid'},
    {key:'notifications', label:'الإشعارات', icon:'bell', count:unread},
    {key:'docs', label:'الأدلة والمستندات', icon:'fileCheck'},
    {key:'contact', label:'تواصل معنا', icon:'phone'},
    {key:'profile', label:'الملف الشخصي', icon:'user'},
  ];

  const wizard = requestingSvc && (
    <NewRequestWizard svc={requestingSvc} citizen={citizen} simNow={simNow}
      onClose={()=>setRequestingSvc(null)}
      onViewApp={(id)=>{ setRequestingSvc(null); setSelectedSvc(null); setSelectedAppId(id); }}/>
  );

  let body;
  if(selectedApp) body = <CitizenRequestDetail app={selectedApp} citizen={citizen} simNow={simNow} onBack={()=>setSelectedAppId(null)}/>;
  else if(selectedSvc) body = <CitizenServiceDetail svc={selectedSvc} onBack={()=>setSelectedSvc(null)} onSubmit={()=>setRequestingSvc(selectedSvc)}/>;
  else body = (
    <React.Fragment>
      {tab==='home' && <CitizenHome citizen={citizen} apps={myApps} simNow={simNow} onOpenApp={setSelectedAppId} onOpenCategory={(c)=>{setTab('catalog'); setCategoryFilter(c);}} onNewRequest={()=>{setTab('catalog'); setCategoryFilter(null);}}/>}
      {tab==='track' && <CitizenTrack apps={myApps} simNow={simNow} onOpen={setSelectedAppId}/>}
      {tab==='catalog' && <CitizenCatalog initialCategory={categoryFilter} onOpenSvc={setSelectedSvc}/>}
      {tab==='notifications' && <CitizenNotifications notifs={myNotifs} citizenId={state.auth.userId} onOpen={setSelectedAppId}/>}
      {tab==='docs' && <CitizenGuides onOpenSvc={setSelectedSvc}/>}
      {tab==='contact' && <CitizenContact apps={myApps} citizen={citizen} simNow={simNow}/>}
      {tab==='profile' && <CitizenProfile citizen={citizen} apps={myApps}/>}
    </React.Fragment>
  );

  return (
    <React.Fragment>
      <SubNav tabs={tabs} active={(selectedApp||selectedSvc)?null:tab} onChange={(k)=>{ setTab(k); setCategoryFilter(null); setSelectedAppId(null); setSelectedSvc(null); }}/>
      <div className="page">{body}</div>
      {wizard}
    </React.Fragment>
  );
}

function CitizenProfile({citizen, apps}){

  function save(){
    dispatch({type:'UPDATE_CITIZEN_PROFILE', citizenId:citizen.id, mobile:mobile.trim(), email:email.trim(), address});
    setSaved(true);
    setTimeout(()=>setSaved(false), 2200);
  }

  const active = apps.filter(a=>!['delivered','cancelled'].includes(a.status));
  const delivered = apps.filter(a=>a.status==='delivered');

        </div>
      </div>
    </div>
  );
}

function CitizenTrack({apps, simNow, onOpen}){
  const [filter, setFilter] = useState('all');
  const filters = [
    {k:'all', l:'الكل', f:()=>true},
    {k:'active', l:'قيد المعالجة', f:a=>!['delivered','cancelled'].includes(a.status) && !isReadyForPickup(a)},
    {k:'ready', l:'جاهزة للاستلام', f:isReadyForPickup},
    {k:'done', l:'مكتملة', f:a=>a.status==='delivered'},
  ];
  const list = apps.filter(filters.find(x=>x.k===filter).f).slice().sort((a,b)=>b.submittedAt-a.submittedAt);
  return (
    <div>
      <PageHeader title="تتبع معاملاتي" sub="كل معاملاتك، بحالتها اللحظية الحقيقية."/>
      <div className="chip-row">
        {filters.map(x=><button key={x.k} className={'btn btn-sm '+(filter===x.k?'btn-maroon':'btn-ghost')} onClick={()=>setFilter(x.k)}>{x.l} ({toAr(apps.filter(x.f).length)})</button>)}
      </div>
      {list.length===0 ? <div className="card"><EmptyState icon="clipboard" title="لا توجد معاملات هنا" sub="قدّم طلبك من قائمة خدمات البلدية."/></div> : (
        <div className="grid grid-2">
          {list.map(a=>{
            const overdue = isStageOverdue(a,simNow);
            const st = a.stages[activeStageIndex(a)];
            const remain = timeRemainingLabel(a,simNow);
            const doneCount = a.stages.filter(s=>s.status==='done').length;
            return (
              <div key={a.id} className="card card-pad clickable" onClick={()=>onOpen(a.id)}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:10, marginBottom:10}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontWeight:800, fontSize:15}}>{svcName(a.serviceId)}</div>
                    <div style={{fontSize:11.5, color:'var(--muted)'}}><span dir="ltr">#{a.reqNumber}</span> · {fmtDateTime(a.submittedAt)}</div>
                  </div>
                  <AppStatus app={a} simNow={simNow}/>
                </div>
                <div className="progress" style={{marginBottom:8}}><div style={{width:(doneCount/a.stages.length*100)+'%', background: overdue?'var(--danger)':'var(--olive)'}}/></div>
                <div style={{fontSize:12, color: overdue?'var(--danger)':'var(--ink-soft)', fontWeight:700}}>
                  {a.status==='delivered' ? 'اكتملت وتم التسليم' : isReadyForPickup(a) ? 'جاهزة — تفضّل لاستلامها من خدمات الجمهور'
                    : a.status==='on_hold' ? ('متوقفة — '+st.pauseReason) : (st ? (st.citizenLabel+' · لدى '+deptName(st.department)+(remain?' · '+remain.label:'')) : '')}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const WIZARD_STEPS = ['بيانات مقدم الطلب','المستندات المطلوبة','المراجعة والتأكيد'];

function NewRequestWizard({svc, citizen, simNow, onClose, onViewApp}){
  const {dispatch} = useStore();
  const [step, setStep] = useState(0);
  const [phone, setPhone] = useState(citizen.mobile);
  const [email, setEmail] = useState(citizen.email);
  const [address, setAddress] = useState({...citizen.address});
  const [notes, setNotes] = useState('');
  const [attached, setAttached] = useState({});
  const [ack, setAck] = useState(false);
  const [submittedApp, setSubmittedApp] = useState(null);

  const allAttached = svc.docs.every(d=>attached[d]);
  const canNext = step===0 ? (phone.trim().length>0 && email.trim().length>0) : step===1 ? allAttached : ack;

  function handleFile(doc, e){
    const file = e.target.files && e.target.files[0];
    if(file) setAttached(prev=>({...prev, [doc]:file.name}));
  }

  function submit(){
    const app = createNewApplication(svc, citizen, phone, email, address, notes, {...attached}, simNow);
    dispatch({type:'SUBMIT_NEW_APPLICATION', application:app});
    setSubmittedApp(app);
  }

  if(submittedApp){
    return (
      <Modal title="تم التقديم" onClose={onClose}>
        <div style={{textAlign:'center', padding:'10px 0 6px'}}>
          <div style={{width:60,height:60,borderRadius:'50%',background:'var(--success-bg)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}><Icon name="checkCircle" size={30} color="var(--success)"/></div>
          <div style={{fontWeight:800, fontSize:17, marginBottom:6}}>تم تقديم طلبك بنجاح</div>
          <div style={{fontSize:13, color:'var(--ink-soft)', marginBottom:18}}>معاملتك الآن بمرحلة «استلام الطلب» — رح تشوفي كل تحديث لحظة ما يصير، بدون ما تحتاجي تتصلي تسألي.</div>
          <div className="card card-pad" style={{display:'inline-block', padding:'10px 22px', marginBottom:22}}>
            <div style={{fontSize:11, color:'var(--muted)'}}>رقم المعاملة</div>
            <div style={{fontWeight:800, fontSize:18}} dir="ltr">#{submittedApp.reqNumber}</div>
          </div>
          <div style={{display:'flex', gap:10, justifyContent:'center'}}>
            <button className="btn btn-outline" onClick={onClose}>العودة للرئيسية</button>
            <button className="btn btn-maroon" onClick={()=>onViewApp(submittedApp.id)}>تتبع معاملتي الآن<Icon name="arrowLeft" size={14}/></button>
          </div>
        </div>
      </Modal>
    );
  }

  return (
    <Modal title={'تقديم طلب: '+svc.name} onClose={onClose} wide>
      <div style={{display:'flex', gap:6, marginBottom:22}}>
        {WIZARD_STEPS.map((label,i)=>(
          <div key={i} style={{flex:1, textAlign:'center'}}>
            <div style={{width:28,height:28,borderRadius:'50%', margin:'0 auto 6px', display:'flex',alignItems:'center',justifyContent:'center', fontWeight:800, fontSize:12.5,
              background: i<=step?'var(--maroon)':'var(--border)', color: i<=step?'#fff':'var(--muted)'}}>{toAr(i+1)}</div>
            <div style={{fontSize:11, fontWeight:700, color:i===step?'var(--ink)':'var(--muted)'}}>{label}</div>
          </div>
        ))}
      </div>

      {step===0 && (
        <div>
          <div className="card card-pad" style={{marginBottom:16, background:'var(--cream-soft)'}}>
            <div style={{fontSize:11.5, color:'var(--muted)', marginBottom:8}}>بيانات مقدم الطلب (من ملفك الشخصي)</div>
            <div style={{fontSize:13.5, fontWeight:700}}>{citizen.name}</div>
            <div style={{fontSize:12, color:'var(--ink-soft)'}} dir="ltr">رقم الهوية: {citizen.nationalId}</div>
          </div>
          <div className="row2">
            <Field label="رقم الهاتف للتواصل"><input value={phone} onChange={e=>setPhone(e.target.value)} dir="ltr"/></Field>
            <Field label="البريد الإلكتروني" hint="سيُستخدم لإرسال إشعارات المعاملة"><input value={email} onChange={e=>setEmail(e.target.value)} dir="ltr"/></Field>
          </div>
          <div className="row2">
            <Field label="الحي"><input value={address.neighborhood||''} onChange={e=>setAddress({...address, neighborhood:e.target.value})}/></Field>
            <Field label="الشارع"><input value={address.street||''} onChange={e=>setAddress({...address, street:e.target.value})}/></Field>
          </div>
          <div className="row2">
            <Field label="البناء"><input value={address.building||''} onChange={e=>setAddress({...address, building:e.target.value})}/></Field>
            <Field label="ملاحظات إضافية (اختياري)"><input value={notes} onChange={e=>setNotes(e.target.value)}/></Field>
          </div>
        </div>
      )}

      {step===1 && (
        <div>
          <div className="section-sub" style={{marginBottom:14}}>هاي المستندات المطلوبة لخدمة «{svc.name}» — أرفقي كل وحدة عشان تقدري تكملي.</div>
          {svc.docs.map((d,i)=>(
            <div key={i} className="card card-pad" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10, marginBottom:8}}>
              <div style={{display:'flex',alignItems:'center',gap:8, minWidth:0}}>
                <Icon name="fileCheck" size={16} color={attached[d]?'var(--success)':'var(--muted)'}/>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:13, fontWeight:700}}>{d}</div>
                  {attached[d] && <div style={{fontSize:11, color:'var(--success)'}}>مرفَق: {attached[d]}</div>}
                </div>
              </div>
              <label className="btn btn-sm btn-outline" style={{cursor:'pointer', flexShrink:0}}>
                {attached[d] ? 'تغيير' : 'إرفاق ملف'}
                <input type="file" style={{display:'none'}} onChange={e=>handleFile(d,e)}/>
              </label>
            </div>
          ))}
        </div>
      )}

      {step===2 && (
        <div>
          <div className="row3" style={{marginBottom:16}}>
            <div className="card card-pad" style={{textAlign:'center'}}><div style={{fontSize:11.5,color:'var(--muted)',marginBottom:4}}>الرسوم</div><div style={{fontWeight:800,fontSize:16}}>{svc.fee>0?(svc.fee+' '+svcCurrency(svc.currency)):'مجانية'}</div></div>
            <div className="card card-pad" style={{textAlign:'center'}}><div style={{fontSize:11.5,color:'var(--muted)',marginBottom:4}}>مدة الإنجاز</div><div style={{fontWeight:800,fontSize:16}}>{svc.durationLabel}</div></div>
            <div className="card card-pad" style={{textAlign:'center'}}><div style={{fontSize:11.5,color:'var(--muted)',marginBottom:4}}>المستندات المرفَقة</div><div style={{fontWeight:800,fontSize:16}}>{toAr(svc.docs.length)}/{toAr(svc.docs.length)}</div></div>
          </div>
          <div className="card card-pad" style={{marginBottom:16}}>
            <div style={{fontWeight:800, marginBottom:10}}>ملخص الطلب</div>
            <div style={{fontSize:13, display:'flex',flexDirection:'column',gap:6}}>
              <div>مقدّم الطلب: <b>{citizen.name}</b></div>
              <div>الهاتف: <b dir="ltr">{phone}</b></div>
              <div>البريد الإلكتروني: <b dir="ltr">{email}</b></div>
              <div>العنوان: <b>{formatAddress(address)}</b></div>
              <div>الخدمة: <b>{svc.name}</b></div>
              {notes.trim() && <div>ملاحظات: {notes.trim()}</div>}
            </div>
          </div>
          <label style={{display:'flex', alignItems:'flex-start', gap:8, fontSize:12.5, cursor:'pointer', color:'var(--ink-soft)'}}>
            <input type="checkbox" checked={ack} onChange={e=>setAck(e.target.checked)} style={{marginTop:2}}/>
            أقر بأن المعلومات والمستندات المرفَقة صحيحة، وبأن تقديم بيانات غير صحيحة يعرّض الطلب للرفض.
          </label>
        </div>
      )}

      <div style={{display:'flex', justifyContent:'space-between', marginTop:24, paddingTop:16, borderTop:'1px solid var(--border)'}}>
        <button className="btn btn-ghost" onClick={()=> step===0 ? onClose() : setStep(step-1)}>{step===0?'إلغاء':'السابقة'}</button>
        {step<2
          ? <button className="btn btn-maroon" disabled={!canNext} onClick={()=>setStep(step+1)}>التالية<Icon name="arrowLeft" size={14}/></button>
          : <button className="btn btn-maroon" disabled={!canNext} onClick={submit}><Icon name="send" size={15}/>تأكيد وتقديم الطلب</button>}
      </div>
    </Modal>
  );
}

              <div style={{marginTop:14}}>
                <Field label={'استفسار للدائرة المسؤولة'+(st?' ('+deptName(st.department)+')':'')}><textarea value={inquiry} onChange={e=>setInquiry(e.target.value)} placeholder="اكتب استفسارك..."/></Field>
                <button className="btn btn-sm btn-maroon" disabled={!inquiry.trim()} onClick={()=>{ dispatch({type:'CITIZEN_INQUIRY', appId:app.id, by:citizen.name, text:inquiry.trim()}); setInquiry(''); }}><Icon name="send" size={13}/>إرسال</button>
              </div>
            )}
          </div>
        </div>
        <div className="stack">
          <div className="card card-pad">
            <CardTitle icon="clipboard">ملخص المعاملة</CardTitle>
            <KV k="الحالة" v={<AppStatus app={app} simNow={simNow}/>}/>
            <KV k="المرحلة الحالية" v={st ? st.citizenLabel : '—'}/>
            <KV k="لدى" v={st ? deptName(st.department) : '—'}/>
            <KV k="المراحل المنجزة" v={toAr(app.stages.filter(s=>s.status==='done').length)+' / '+toAr(app.stages.length)}/>
            <KV k="المدة الكلية المعلنة" v={fmtDuration(totalAllowed)}/>
          </div>
          {app.status==='delivered' && (
            <div className="card card-pad">
              <CardTitle icon="star">قيّم الخدمة</CardTitle>
              {app.rated ? (
                <div style={{fontSize:13}}>
                  <div className="stars">{[1,2,3,4,5].map(i=><Icon key={i} name="star" size={20} color={i<=app.rating?'#C9962E':'var(--border)'}/>)}</div>
                  {app.ratingComment && <div style={{marginTop:8, color:'var(--ink-soft)'}}>{app.ratingComment}</div>}
                  <div style={{marginTop:8, fontSize:11.5, color:'var(--muted)'}}>شكرًا — تقييمك وصل للإدارة.</div>
                </div>
              ) : (
                <div>
                  <div className="stars" style={{marginBottom:10}}>
                    {[1,2,3,4,5].map(i=><button key={i} className="star-btn" onClick={()=>setStars(i)}><Icon name="star" size={22} color={i<=stars?'#C9962E':'var(--muted)'}/></button>)}
                  </div>
                  <textarea value={comment} onChange={e=>setComment(e.target.value)} placeholder="ملاحظة اختيارية..." style={{marginBottom:10}}/>
                  <button className="btn btn-sm btn-maroon" disabled={!stars} onClick={()=>dispatch({type:'RATE_APP', appId:app.id, rating:stars, comment:comment.trim()})}>إرسال التقييم</button>
                </div>
              )}
            </div>
          )}
          {app.attachedDocs && Object.keys(app.attachedDocs).length>0 && (
            <div className="card card-pad">
              <CardTitle icon="fileCheck">المستندات المرفَقة</CardTitle>
              {Object.entries(app.attachedDocs).map(([doc,file],i)=>(
                <div key={i} className="kv"><span style={{display:'flex',alignItems:'center',gap:8, minWidth:0}}><Icon name="fileCheck" size={14} color="var(--success)"/>{doc}</span><span className="muted" style={{fontSize:11}} dir="ltr">{file}</span></div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ===================== EMPLOYEE APP =====================
function deptAppsFor(state, deptId){ return state.applications.filter(a=>a.stages.some(s=>s.department===deptId)); }
function queueFor(state, deptId){
  return state.applications.filter(a=>{
    const idx = activeStageIndex(a);
    return idx>=0 && a.stages[idx].department===deptId && !['delivered','cancelled'].includes(a.status);
  });
}

function QueueTable({apps, state, simNow, onOpen, showStage, emptyTitle, emptySub}){
  if(apps.length===0) return <div className="card"><EmptyState icon="checkCircle" title={emptyTitle||'لا توجد معاملات'} sub={emptySub||''}/></div>;
  return (
    <div className="card table-wrap">
      <table className="table">
        <thead><tr><th>#</th><th>نوع المعاملة</th><th>مقدم الطلب</th>{showStage && <th>المرحلة الحالية</th>}<th>الوقت</th><th>الحالة</th><th></th></tr></thead>
        <tbody>
          {apps.map(a=>{
            const citizen = state.citizens.find(c=>c.id===a.citizenId);
            const st = a.stages[activeStageIndex(a)];
            const r = timeRemainingLabel(a, simNow);
            const pendingAlert = alertState(a)==='pending';
            return (
              <tr key={a.id} className={pendingAlert?'row-alert':''}>
                <td dir="ltr" style={{color:'var(--muted)', fontSize:11.5, whiteSpace:'nowrap'}}>{a.reqNumber}</td>
                <td style={{fontWeight:700}}>{svcName(a.serviceId)}{pendingAlert && <span className="badge" style={{color:'var(--danger)',background:'var(--danger-bg)',marginRight:6,fontSize:10}}><Icon name="bell" size={10}/>تنبيه المدير</span>}</td>
                <td>{citizen?citizen.name:''}</td>
                {showStage && <td>{st ? <span>{st.citizenLabel} <span className="muted" style={{fontSize:11.5}}>· {deptName(st.department)}</span></span> : '—'}</td>}
                <td style={{whiteSpace:'nowrap', color: r&&r.overdue?'var(--danger)':'var(--ink-soft)', fontWeight: r&&r.overdue?700:400}}>{a.status==='on_hold'?'الساعة متوقفة':(r?r.label:(a.status==='delivered'?'مكتملة':'—'))}</td>
                <td><AppStatus app={a} simNow={simNow}/></td>
                <td><button className="btn btn-sm btn-outline" onClick={()=>onOpen(a.id)}>فتح</button></td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function EmployeeApp(){
  const {state} = useStore();
  const employee = EMPLOYEES.find(e=>e.id===state.auth.userId);
  const [nav, setNav] = useState('tasks');
  const [selectedAppId, setSelectedAppId] = useState(null);
  const [creatingTransaction, setCreatingTransaction] = useState(false);
  useFocusApp(setSelectedAppId);
  const simNow = Date.now()+state.simOffset;
  const dept = employee.department;
  const isFrontDesk = dept==='pubserv';

  const myQueue = queueFor(state, dept);
  const incoming = myQueue.filter(a=>{ const st=a.stages[activeStageIndex(a)]; return a.status!=='on_hold' && st && (simNow-st.startedAt) < 12*HOUR; });
  const overdue = myQueue.filter(a=>isStageOverdue(a,simNow));
  const doneToday = state.applications.filter(a=> a.stages.some(s=> s.department===dept && s.status==='done' && s.endedAt && (simNow-s.endedAt)<24*HOUR));
  const pendingAlerts = state.applications.filter(a=>a.delayAlert && !a.delayAlert.resolved && a.delayAlert.department===dept);

  const navItems = [
    {key:'tasks', label:'لوحة المهام', icon:'home'},
    ...(isFrontDesk ? [{key:'newTransaction', label:'استقبال طلب مواطن', icon:'plus'}] : []),
    {key:'incoming', label:'المعاملات الواردة', icon:'inbox', count:incoming.length},
    {key:'all', label:'كل معاملات الدائرة', icon:'clipboard'},
    {key:'outgoing', label:'المعاملات الصادرة', icon:'arrowLeft'},
    {key:'alerts', label:'تنبيهات المدير', icon:'bell', count:pendingAlerts.length, danger:true},
    {key:'docs', label:'المستندات', icon:'fileCheck'},
    {key:'reports', label:'التقارير', icon:'barChart'},
    {key:'settings', label:'الإعدادات', icon:'settings'},
  ];
  const selectedApp = selectedAppId ? state.applications.find(a=>a.id===selectedAppId) : null;

  let body;
  if(creatingTransaction) body = <EmployeeNewTransaction state={state} employee={employee} simNow={simNow}
    onClose={()=>setCreatingTransaction(false)} onCreated={(id)=>{ setCreatingTransaction(false); setSelectedAppId(id); }}/>;
  else if(selectedApp) body = <EmployeeRequestDetail app={selectedApp} employee={employee} simNow={simNow} onBack={()=>setSelectedAppId(null)}/>;
  else body = (
    <React.Fragment>
      {nav==='tasks' && (
        <div>
          <PageHeader eyebrow={'مرحبًا '+employee.name.split(' ')[0]} title="معًا لإنجاز معاملات المواطنين" sub={'صندوق '+deptName(dept)+' — كل معاملة هون إلها مالك واحد ومدة معلنة.'}
            actions={isFrontDesk && <button className="btn btn-maroon" onClick={()=>setCreatingTransaction(true)}><Icon name="plus" size={14}/>استقبال طلب مواطن</button>}/>
          <div className="grid grid-4" style={{marginBottom:22}}>
            <div className="stat-tile"><div className="num">{toAr(incoming.length)}</div><div className="lbl"><Icon name="inbox" size={13}/>وصلت خلال ١٢ ساعة</div></div>
            <div className="stat-tile"><div className="num">{toAr(myQueue.length)}</div><div className="lbl"><Icon name="clock" size={13}/>قيد المعالجة لديك</div></div>
            <div className={'stat-tile'+(overdue.length>0?' danger':'')}><div className="num">{toAr(overdue.length)}</div><div className="lbl"><Icon name="alert" size={13}/>متأخرة</div></div>
            <div className="stat-tile"><div className="num" style={{color:'var(--success)'}}>{toAr(doneToday.length)}</div><div className="lbl"><Icon name="checkCircle" size={13}/>أُنجزت اليوم</div></div>
          </div>
          {pendingAlerts.length>0 && (
            <Banner tone="danger" icon="bell" action={<button className="btn btn-sm btn-danger" onClick={()=>setNav('alerts')}>عرض التنبيهات</button>}>
              لديك {toAr(pendingAlerts.length)} تنبيه من مدير البلدية بانتظار ردك.
            </Banner>
          )}
          <div className="section-row"><h2 className="sub-title">المعاملات الموكلة إليك</h2></div>
          <QueueTable apps={myQueue.slice().sort((a,b)=>(isStageOverdue(b,simNow)-isStageOverdue(a,simNow)))} state={state} simNow={simNow} onOpen={setSelectedAppId}
            emptyTitle="لا معاملات بانتظارك" emptySub="كل المعاملات المسندة لدائرتك تمت معالجتها."/>
        </div>
      )}
      {nav==='incoming' && (
        <div>
          <PageHeader title="المعاملات الواردة" sub="معاملات وصلت دائرتك خلال آخر ١٢ ساعة."/>
          <QueueTable apps={incoming} state={state} simNow={simNow} onOpen={setSelectedAppId} emptyTitle="لا معاملات واردة جديدة" emptySub="أول ما تنتقل معاملة لدائرتك رح تظهر هون ويوصلك إشعار."/>
        </div>
      )}
      {nav==='all' && <EmployeeAllTransactions state={state} dept={dept} simNow={simNow} onOpen={setSelectedAppId}/>}
      {nav==='outgoing' && <EmployeeOutgoing state={state} employee={employee} simNow={simNow} onOpen={setSelectedAppId}/>}
      {nav==='alerts' && <EmployeeAlerts state={state} dept={dept} simNow={simNow} onOpen={setSelectedAppId}/>}
      {nav==='docs' && <EmployeeDocs state={state} employee={employee} onOpen={setSelectedAppId}/>}
      {nav==='reports' && <EmployeeReports state={state} employee={employee} simNow={simNow}/>}
      {nav==='settings' && <EmployeeSettings employee={employee}/>}
    </React.Fragment>
  );

  return (
    <div className="shell-with-sidebar">
      <Sidebar items={navItems} active={(selectedApp||creatingTransaction)?null:nav} onChange={(k)=>{ setNav(k); setSelectedAppId(null); setCreatingTransaction(false); }}
        footer={<div className="sidebar-card"><div style={{fontWeight:800}}>{deptName(dept)}</div><div className="muted" style={{fontSize:11.5}}>{employee.role}</div></div>}/>
      <div className="main-with-sidebar">{body}</div>
    </div>
  );
}

function EmployeeNewTransaction({state, employee, simNow, onClose, onCreated}){
  const {dispatch} = useStore();
  const [citizenMode, setCitizenMode] = useState('existing');
  const [citizenId, setCitizenId] = useState(state.citizens[0] ? state.citizens[0].id : '');
  const [newCitizen, setNewCitizen] = useState({name:'', nationalId:'', mobile:'', email:''});
  const activeServices = SERVICES.filter(isServiceActive);
  const [svcId, setSvcId] = useState(activeServices[0] ? activeServices[0].id : '');
  const svc = findService(svcId);
  const selectedCitizen = citizenMode==='existing' ? state.citizens.find(c=>c.id===citizenId) : null;
  const [phone, setPhone] = useState(selectedCitizen ? (selectedCitizen.mobile||'') : '');
  const [email, setEmail] = useState(selectedCitizen ? (selectedCitizen.email||'') : '');
  const [address, setAddress] = useState(selectedCitizen ? {...selectedCitizen.address} : {neighborhood:'', street:'', building:''});
  const [notes, setNotes] = useState('');
  const [attached, setAttached] = useState({});

  function pickCitizen(id){
    setCitizenId(id);
    const c = state.citizens.find(x=>x.id===id);
    if(c){ setPhone(c.mobile||''); setEmail(c.email||''); setAddress({...c.address}); }
  }
  function pickService(id){ setSvcId(id); setAttached({}); }
  function handleFile(doc, e){
    const file = e.target.files && e.target.files[0];
    if(file) setAttached(prev=>({...prev, [doc]:file.name}));
  }

  const allAttached = svc ? svc.docs.every(d=>attached[d]) : false;
  const errors = [];
  if(citizenMode==='existing' && !selectedCitizen) errors.push('اختر مواطنًا.');
  if(citizenMode==='new' && (!newCitizen.name.trim()||!newCitizen.nationalId.trim()||!newCitizen.mobile.trim())) errors.push('أكمل بيانات المواطن الجديد (الاسم، رقم الهوية، الجوال).');
  if(!svc) errors.push('اختر خدمة.');
  if(!phone.trim()) errors.push('رقم الهاتف مطلوب.');
  if(svc && !allAttached) errors.push('أرفق كل المستندات المطلوبة بالنيابة عن المواطن قبل التسجيل.');

  function create(){
    if(errors.length>0) return;
    let finalCitizen = selectedCitizen;
    if(citizenMode==='new'){
      finalCitizen = {id:uid('BTN-2026'), name:newCitizen.name.trim(), nationalId:newCitizen.nationalId.trim(),
        password:'1234', mobile:newCitizen.mobile.trim(), email:(newCitizen.email||'').trim()||'citizen@example.ps', address:{...address}};
      dispatch({type:'ADD_CITIZEN', citizen:finalCitizen});
    }
    const app = createNewApplication(svc, finalCitizen, phone.trim(), email.trim(), address, notes, {...attached}, simNow);
    dispatch({type:'SUBMIT_NEW_APPLICATION', application:app});
    onCreated(app.id);
  }

  return (
    <div>
      <PageHeader onBack={onClose} backLabel="رجوع" eyebrow="استقبال طلب مواطن حضوريًا" title="تسجيل معاملة بالنيابة عن مواطن"
        sub="لمّا المواطن يجي حضوريًا وما يكون قدّم أونلاين — سجّلي بياناته وأرفقي مستنداته بنفسك، وبتبدأ المعاملة من عندك مباشرة."
        actions={<button className="btn btn-maroon" disabled={errors.length>0} onClick={create}><Icon name="send" size={14}/>تسجيل المعاملة</button>}/>

      <div className="layout-split">
        <div className="stack">
          <div className="card card-pad">
            <CardTitle icon="user">المواطن</CardTitle>
            <div className="chip-row" style={{marginBottom:14}}>
              <button className={'btn btn-sm '+(citizenMode==='existing'?'btn-maroon':'btn-ghost')} onClick={()=>setCitizenMode('existing')}>مواطن مسجَّل</button>
              <button className={'btn btn-sm '+(citizenMode==='new'?'btn-maroon':'btn-ghost')} onClick={()=>setCitizenMode('new')}>مواطن جديد</button>
            </div>
            {citizenMode==='existing' ? (
              <Field label="اختر المواطن">
                <select value={citizenId} onChange={e=>pickCitizen(e.target.value)}>
                  {state.citizens.map(c=><option key={c.id} value={c.id}>{c.name} — {c.nationalId}</option>)}
                </select>
              </Field>
            ) : (
              <React.Fragment>
                <div className="row2">
                  <Field label="الاسم الكامل"><input value={newCitizen.name} onChange={e=>setNewCitizen({...newCitizen, name:e.target.value})}/></Field>
                  <Field label="رقم الهوية"><input value={newCitizen.nationalId} onChange={e=>setNewCitizen({...newCitizen, nationalId:e.target.value})} dir="ltr"/></Field>
                </div>
                <div className="row2">
                  <Field label="الجوال"><input value={newCitizen.mobile} onChange={e=>{ setNewCitizen({...newCitizen, mobile:e.target.value}); setPhone(e.target.value); }} dir="ltr"/></Field>
                  <Field label="البريد الإلكتروني"><input value={newCitizen.email} onChange={e=>{ setNewCitizen({...newCitizen, email:e.target.value}); setEmail(e.target.value); }} dir="ltr"/></Field>
                </div>
              </React.Fragment>
            )}
          </div>

          <div className="card card-pad">
            <CardTitle icon="layers">الخدمة المطلوبة</CardTitle>
            <Field label="الخدمة">
              <select value={svcId} onChange={e=>pickService(e.target.value)}>
                {activeServices.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </Field>
          </div>

          {svc && (
            <div className="card card-pad">
              <CardTitle icon="fileCheck">المستندات المطلوبة — ارفقيها بالنيابة عن المواطن</CardTitle>
              {svc.docs.length===0 ? <div style={{fontSize:12.5, color:'var(--muted)'}}>هاي الخدمة ما بتحتاج مستندات.</div> : svc.docs.map((d,i)=>(
                <div key={i} className="card card-pad" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10, marginBottom:8}}>
                  <div style={{display:'flex',alignItems:'center',gap:8, minWidth:0}}>
                    <Icon name="fileCheck" size={16} color={attached[d]?'var(--success)':'var(--muted)'}/>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:13, fontWeight:700}}>{d}</div>
                      {attached[d] && <div style={{fontSize:11, color:'var(--success)'}}>مرفَق: {attached[d]}</div>}
                    </div>
                  </div>
                  <label className="btn btn-sm btn-outline" style={{cursor:'pointer', flexShrink:0}}>
                    {attached[d] ? 'تغيير' : 'إرفاق ملف'}
                    <input type="file" style={{display:'none'}} onChange={e=>handleFile(d,e)}/>
                  </label>
                </div>
              ))}
            </div>
          )}

          <div className="card card-pad">
            <CardTitle icon="phone">بيانات التواصل</CardTitle>
            <div className="row2">
              <Field label="رقم الهاتف"><input value={phone} onChange={e=>setPhone(e.target.value)} dir="ltr"/></Field>
              <Field label="البريد الإلكتروني"><input value={email} onChange={e=>setEmail(e.target.value)} dir="ltr"/></Field>
            </div>
            <div className="row3">
              <Field label="الحي"><input value={address.neighborhood||''} onChange={e=>setAddress({...address, neighborhood:e.target.value})}/></Field>
              <Field label="الشارع"><input value={address.street||''} onChange={e=>setAddress({...address, street:e.target.value})}/></Field>
              <Field label="البناء"><input value={address.building||''} onChange={e=>setAddress({...address, building:e.target.value})}/></Field>
            </div>
            <Field label="ملاحظات (اختياري)"><textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="مثال: المواطن جا حضوريًا ومعه المستندات الأصلية..."/></Field>
          </div>
        </div>

        <div className="stack">
          <div className="card card-pad">
            <CardTitle icon="eye">معاينة المسار</CardTitle>
            {svc ? (
              <div className="timeline">
                {svc.stepChain.map((s,i)=>(
                  <div key={i} className={'tl-row '+(i===0?'current':'pending')}>
                    <div className="tl-dot">{toAr(i+1)}</div>
                    <div className="tl-body">
                      <div className="tl-top"><b>{s.citizenLabel}</b></div>
                      <div className="tl-meta">{deptName(s.department)} · {employeeInDept(s.department).name} · {fmtDuration(s.maxDurationHours)}</div>
                    </div>
                  </div>
                ))}
              </div>
            ) : <div style={{fontSize:12.5, color:'var(--muted)'}}>اختر خدمة لعرض مسارها.</div>}
          </div>
          <div className="card card-pad">
            <CardTitle icon="clipboard">ملخص</CardTitle>
            <KV k="المواطن" v={citizenMode==='existing' ? (selectedCitizen?selectedCitizen.name:'—') : (newCitizen.name.trim()||'—')}/>
            <KV k="الخدمة" v={svc?svc.name:'—'}/>
            <KV k="المستندات المرفَقة" v={svc?(toAr(Object.keys(attached).length)+'/'+toAr(svc.docs.length)):'—'}/>
            <KV k="الرسوم" v={svc?(Number(svc.fee)>0?(svc.fee+' '+svcCurrency(svc.currency)):'مجانية'):'—'}/>
          </div>
          {errors.length>0 && (
            <div className="card card-pad">
              <CardTitle icon="alert">قبل التسجيل</CardTitle>
              {errors.map((e,i)=><div key={i} style={{fontSize:12.5, color:'var(--danger)', fontWeight:700, padding:'3px 0'}}>• {e}</div>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Sidebar({items, active, onChange, footer}){
  return (
    <div className="sidebar">
      <div className="sidebar-nav">
        {items.map(n=>(
          <button key={n.key} className={active===n.key?'active':''} onClick={()=>onChange(n.key)}>
            <Icon name={n.icon} size={16}/>{n.label}{n.count>0 && <span className={'count'+(n.danger?' danger':'')}>{toAr(n.count)}</span>}
          </button>
        ))}
      </div>
      {footer}
    </div>
  );
}

function EmployeeAllTransactions({state, dept, simNow, onOpen}){
  const [filter, setFilter] = useState('mine');
  const all = deptAppsFor(state, dept);
  const filters = [
    {k:'mine', l:'لدى دائرتي الآن', f:a=>{ const st=a.stages[activeStageIndex(a)]; return st && st.department===dept && a.status!=='delivered'; }},
    {k:'upcoming', l:'قادمة لدائرتي', f:a=>{ const i=activeStageIndex(a); return i>=0 && a.stages.slice(i+1).some(s=>s.department===dept) && a.stages[i].department!==dept; }},
    {k:'passed', l:'مرّت بدائرتي', f:a=>a.stages.some(s=>s.department===dept && s.status==='done')},
    {k:'all', l:'الكل', f:()=>true},
  ];
  const list = all.filter(filters.find(x=>x.k===filter).f);
  return (
    <div>
      <PageHeader title="كل معاملات الدائرة" sub={'كل معاملة مسارها بيمر بـ'+deptName(dept)+' — الحالية، القادمة، والمنجزة.'}/>
      <div className="chip-row">
        {filters.map(x=><button key={x.k} className={'btn btn-sm '+(filter===x.k?'btn-maroon':'btn-ghost')} onClick={()=>setFilter(x.k)}>{x.l} ({toAr(all.filter(x.f).length)})</button>)}
      </div>

function deptPerformance(state, deptId, simNow){
  const touched = deptAppsFor(state, deptId);
  const done = [];
  touched.forEach(a=>a.stages.forEach(s=>{ if(s.department===deptId && s.status==='done' && s.startedAt && s.endedAt) done.push({h:(s.endedAt-s.startedAt)/HOUR, max:s.maxDurationHours, endedAt:s.endedAt}); }));
  const queue = queueFor(state, deptId);
  const overdue = queue.filter(a=>isStageOverdue(a,simNow));
  const onTime = done.filter(d=>d.h<=d.max).length;
  const alerts = []; state.applications.forEach(a=>(a.alertHistory||[]).forEach(al=>{ if(al.department===deptId) alerts.push(al); }));
  const pauses = []; touched.forEach(a=>a.stages.forEach(s=>{ if(s.department===deptId) (s.pauseLog||(s.pauseReason?[{reason:s.pauseReason, at:s.pausedAt}]:[])).forEach(p=>pauses.push({...p, app:a})); }));
  return {
    touched:touched.length, queue:queue.length, overdue:overdue.length, overdueApps:overdue,
    doneCount:done.length, doneWeek:done.filter(d=>(simNow-d.endedAt)<7*DAY).length,
    avgH: done.length ? done.reduce((a,b)=>a+b.h,0)/done.length : null,
    onTimePct: done.length ? Math.round(onTime/done.length*100) : null,
    alertsSent:alerts.length, alertsReplied:alerts.filter(x=>x.reply).length, pauses,
    services:SERVICES.filter(s=>isServiceActive(s) && s.stepChain.some(st=>st.department===deptId)).length,
  };
}

function computeManagerStats(state, simNow){
  const apps = state.applications;
  const active = apps.filter(a=>!['delivered','cancelled'].includes(a.status));
  const overdue = active.filter(a=>isStageOverdue(a,simNow));
  const delivered = apps.filter(a=>a.status==='delivered');
  const distByDept = {};
  DEPARTMENTS.forEach(d=>distByDept[d.id]=0);
  active.forEach(a=>{ const st=a.stages[activeStageIndex(a)]; if(st) distByDept[st.department]=(distByDept[st.department]||0)+1; });
  const avgByDept = {};
  DEPARTMENTS.forEach(d=>{
    const durations=[];
    apps.forEach(a=> a.stages.forEach(s=>{ if(s.department===d.id && s.status==='done' && s.startedAt && s.endedAt) durations.push((s.endedAt-s.startedAt)/DAY); }));
    avgByDept[d.id] = durations.length ? (durations.reduce((a,b)=>a+b,0)/durations.length) : null;
  });
  return {total:apps.length, active:active.length, overdue:overdue.length, overdueApps:overdue, delivered:delivered.length, distByDept, avgByDept};
}

function ManagerApp(){
  const {state} = useStore();
  const manager = EMPLOYEES.find(e=>e.id===state.auth.userId);
  const [nav, setNav] = useState('dashboard');
  const [selectedAppId, setSelectedAppId] = useState(null);
  const [alertApps, setAlertApps] = useState(null);
  const [editingService, setEditingService] = useState(null);
  const [creatingTransaction, setCreatingTransaction] = useState(false);
  useFocusApp(setSelectedAppId);
  const simNow = Date.now()+state.simOffset;
  const stats = computeManagerStats(state, simNow);
  const needAlert = stats.overdueApps.filter(a=>alertState(a)!=='pending');
  const selectedApp = selectedAppId ? state.applications.find(a=>a.id===selectedAppId) : null;
  const openAlert = (apps)=>setAlertApps(apps);
  const closeSubPages = ()=>{ setSelectedAppId(null); setEditingService(null); setCreatingTransaction(false); };
  const goToTransaction = (id)=>{ setCreatingTransaction(false); setSelectedAppId(id); };

  const navItems = [
    {key:'dashboard', label:'لوحة المتابعة', icon:'home'},
    {key:'all', label:'المعاملات', icon:'clipboard'},
    {key:'alerts', label:'التنبيهات', icon:'bell', count:needAlert.length, danger:true},
    {key:'depts', label:'الأقسام', icon:'building'},
    {key:'staff', label:'أداء الموظفين', icon:'users'},
    {key:'services', label:'الخدمات والمسارات', icon:'layers'},
    {key:'reports', label:'التقارير', icon:'barChart'},
    {key:'settings', label:'الإعدادات', icon:'settings'},
  ];

  let body;
  if(creatingTransaction) body = <ManagerNewTransaction state={state} manager={manager} simNow={simNow} onClose={()=>setCreatingTransaction(false)} onCreated={goToTransaction}/>;
  else if(editingService) body = <ServiceBuilder initial={editingService} manager={manager} onDone={()=>{ setEditingService(null); setNav('services'); }}/>;
  else if(selectedApp) body = <ManagerRequestDetail app={selectedApp} simNow={simNow} onBack={()=>setSelectedAppId(null)} onAlert={openAlert}/>;
  else body = (
    <React.Fragment>
      {nav==='dashboard' && <ManagerDashboard state={state} stats={stats} simNow={simNow} needAlert={needAlert} onOpen={setSelectedAppId} onAlert={openAlert} onGo={setNav} onNewTransaction={()=>setCreatingTransaction(true)}/>}
      {nav==='all' && <ManagerAllTransactions state={state} simNow={simNow} onOpen={setSelectedAppId} onAlert={openAlert} onNewTransaction={()=>setCreatingTransaction(true)}/>}
      {nav==='alerts' && <ManagerAlerts state={state} simNow={simNow} needAlert={needAlert} onOpen={setSelectedAppId} onAlert={openAlert}/>}
      {nav==='depts' && <ManagerDepartments state={state} simNow={simNow} onAlert={openAlert}/>}
      {nav==='staff' && <ManagerStaff state={state} simNow={simNow}/>}
      {nav==='services' && <ManagerServices state={state} onEdit={setEditingService}/>}
      {nav==='reports' && <ManagerReports state={state} simNow={simNow}/>}
      {nav==='settings' && <ManagerSettings state={state} manager={manager}/>}
    </React.Fragment>
  );

  return (
    <div className="shell-with-sidebar">
      <Sidebar items={navItems} active={(selectedApp||editingService||creatingTransaction)?null:nav} onChange={(k)=>{ setNav(k); closeSubPages(); }}
        footer={<div className="sidebar-card"><div style={{fontWeight:800}}>{manager.name}</div><div className="muted" style={{fontSize:11.5}}>صلاحيات: تنبيه الدوائر، إدارة الخدمات والمسارات، إضافة معاملات</div></div>}/>
      <div className="main-with-sidebar">{body}</div>
      {alertApps && <AlertComposer apps={alertApps} simNow={simNow} onClose={()=>setAlertApps(null)}/>}
    </div>
  );
}

              <div className="track"><div className="fill" style={{width:(d.dist/maxDist*100)+'%'}}/></div>
            </div>
          ))}
        </div>
        <div className="card card-pad">
          <CardTitle icon="clock">متوسط مدة المعالجة (بالأيام)</CardTitle>
          {deptRows.filter(d=>d.avg!=null).sort((a,b)=>b.avg-a.avg).map(d=>(

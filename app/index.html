function ManagerAllTransactions({state, simNow, onOpen, onAlert, onNewTransaction}){
  const [q, setQ] = useState('');
  const [dept, setDept] = useState('');
  const [status, setStatus] = useState('');
  const list = state.applications.filter(a=>{
    const st = a.stages[activeStageIndex(a)];
    const citizen = state.citizens.find(c=>c.id===a.citizenId);
    if(q.trim() && !(a.reqNumber.includes(q.trim()) || svcName(a.serviceId).includes(q.trim()) || (citizen && citizen.name.includes(q.trim())))) return false;
    if(dept && (!st || st.department!==dept)) return false;
    if(status==='overdue' && !isStageOverdue(a,simNow)) return false;
    if(status==='ready' && !isReadyForPickup(a)) return false;
    if(status && !['overdue','ready'].includes(status) && a.status!==status) return false;
    return true;
  }).sort((a,b)=>b.submittedAt-a.submittedAt);
  return (
    <div>
      <PageHeader title="كل المعاملات" sub={'عرض '+toAr(list.length)+' من أصل '+toAr(state.applications.length)+' معاملة.'}
        actions={<button className="btn btn-maroon" onClick={onNewTransaction}><Icon name="plus" size={14}/>معاملة جديدة</button>}/>
      <div className="filter-bar">
        <div style={{position:'relative', flex:'1 1 220px'}}>
          <input placeholder="رقم المعاملة، الخدمة، أو اسم المواطن..." value={q} onChange={e=>setQ(e.target.value)} style={{paddingRight:34}}/>
          <div style={{position:'absolute', right:10, top:10, color:'var(--muted)'}}><Icon name="search" size={15}/></div>
        </div>
        <select value={dept} onChange={e=>setDept(e.target.value)} style={{flex:'0 1 200px'}}>
          <option value="">كل الدوائر</option>
          {DEPARTMENTS.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
        <select value={status} onChange={e=>setStatus(e.target.value)} style={{flex:'0 1 180px'}}>
          <option value="">كل الحالات</option>
          <option value="overdue">متأخرة</option>
          <option value="in_progress">قيد المعالجة</option>
          <option value="on_hold">معلّقة</option>
          <option value="ready">جاهزة للاستلام</option>
          <option value="delivered">مكتملة</option>
        </select>
      </div>
      <div className="card table-wrap">
        <table className="table">
          <thead><tr><th>#</th><th>الخدمة</th><th>المواطن</th><th>الدائرة الحالية</th><th>الوقت</th><th>الحالة</th><th>التنبيه</th><th></th></tr></thead>
          <tbody>
            {list.map(a=>{
              const citizen = state.citizens.find(c=>c.id===a.citizenId);
              const st = a.stages[activeStageIndex(a)];
              const r = timeRemainingLabel(a, simNow);
              const active = !['delivered','cancelled'].includes(a.status);
              return (
                <tr key={a.id}>
                  <td dir="ltr" style={{color:'var(--muted)', fontSize:11.5}}>{a.reqNumber}</td>
                  <td style={{fontWeight:700}}>{svcName(a.serviceId)}</td>
                  <td>{citizen?citizen.name:''}</td>
                  <td>{st?deptName(st.department):'—'}</td>
                  <td style={{whiteSpace:'nowrap', color:r&&r.overdue?'var(--danger)':'var(--ink-soft)', fontWeight:r&&r.overdue?700:400}}>{a.status==='on_hold'?'متوقفة بسبب':(r?r.label:'—')}</td>
                  <td><AppStatus app={a} simNow={simNow}/></td>
                  <td>{active ? <AlertBadge app={a}/> : <span className="muted">—</span>}</td>
                  <td style={{whiteSpace:'nowrap'}}>
                    <div style={{display:'flex', gap:6, justifyContent:'flex-end'}}>
                      {active && <button className="icon-btn" title="إرسال تنبيه للدائرة" disabled={alertState(a)==='pending'} onClick={()=>onAlert([a])}><Icon name="bell" size={14}/></button>}
                      <button className="btn btn-sm btn-outline" onClick={()=>onOpen(a.id)}>فتح</button>
                    </div>
                  </td>
                </tr>
              );
            })}
            {list.length===0 && <tr><td colSpan={8}><EmptyState icon="search" title="لا نتائج" sub="غيّر معايير البحث."/></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ManagerAlerts({state, simNow, needAlert, onOpen, onAlert}){
  const pending = state.applications.filter(a=>alertState(a)==='pending');

  state.applications.forEach(a=>(a.alertHistory||[]).forEach(al=>history.push({...al, app:a})));
  history.sort((x,y)=>y.sentAt-x.sentAt);
  const replied = history.filter(h=>h.reply).length;
  return (
    <div>
      <PageHeader title="التنبيهات والتصعيد" sub="أرسل تنبيهًا للدائرة اللي صار عندها التأخير، وتابع ردها — كل شي موثّق بسجل."
        actions={needAlert.length>0 && <button className="btn btn-danger" onClick={()=>onAlert(needAlert)}><Icon name="bell" size={14}/>تنبيه الكل ({toAr(needAlert.length)})</button>}/>
      <div className="grid grid-3" style={{marginBottom:22}}>
        <div className={'stat-tile'+(needAlert.length?' danger':'')}><div className="num">{toAr(needAlert.length)}</div><div className="lbl"><Icon name="alert" size={13}/>متأخرة بدون تنبيه فعّال</div></div>
        <div className="stat-tile"><div className="num">{toAr(pending.length)}</div><div className="lbl"><Icon name="clock" size={13}/>بانتظار رد الدائرة</div></div>
        <div className="stat-tile"><div className="num" style={{color:'var(--olive)'}}>{toAr(replied)}</div><div className="lbl"><Icon name="message" size={13}/>تم الرد عليها</div></div>
      </div>

          <OverdueTable apps={needAlert} simNow={simNow} onOpen={onOpen} onAlert={onAlert}/>}
      </div>

      <div className="card card-pad" style={{marginBottom:18}}>
        <CardTitle icon="clock">بانتظار رد الدائرة</CardTitle>
        {pending.length===0 ? <div style={{fontSize:12.5, color:'var(--muted)'}}>لا توجد تنبيهات مفتوحة.</div> : (
          <div className="table-wrap">
            <table className="table">
              <thead><tr><th>المعاملة</th><th>الدائرة</th><th>التنبيه</th><th>أُرسل</th><th></th></tr></thead>
              <tbody>
                {pending.map(a=>(
                  <tr key={a.id}>
                    <td><b>{svcName(a.serviceId)}</b><div dir="ltr" className="muted" style={{fontSize:11, textAlign:'right'}}>#{a.reqNumber}</div></td>
                    <td>{deptName(a.delayAlert.department)}{a.delayAlert.urgency==='urgent' && <span className="badge" style={{color:'#fff', background:'var(--danger)', marginRight:6, fontSize:9.5}}>عاجل</span>}</td>
                    <td style={{maxWidth:300}}>{a.delayAlert.text}</td>
                    <td style={{whiteSpace:'nowrap'}}>{fmtDateTime(a.delayAlert.sentAt)}</td>
                    <td><button className="btn btn-sm btn-outline" onClick={()=>onOpen(a.id)}>فتح</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="card card-pad">
        <CardTitle icon="layers">سجل كل التنبيهات</CardTitle>
        {history.length===0 ? <div style={{fontSize:12.5, color:'var(--muted)'}}>لم يُرسل أي تنبيه بعد.</div> : (
          <div className="table-wrap">
            <table className="table">
              <thead><tr><th>التاريخ</th><th>الدائرة</th><th>المعاملة</th><th>التنبيه</th><th>رد الدائرة</th></tr></thead>
              <tbody>
                {history.map(h=>(
                  <tr key={h.id}>
                    <td style={{whiteSpace:'nowrap'}}>{fmtDateTime(h.sentAt)}</td>
                    <td>{deptName(h.department)}</td>
                    <td>{svcName(h.app.serviceId)} <span dir="ltr" className="muted" style={{fontSize:11}}>#{h.app.reqNumber}</span></td>
                    <td style={{maxWidth:260}}>{h.text}</td>
                    <td style={{maxWidth:260, color:h.reply?'var(--olive)':'var(--muted)', fontWeight:h.reply?700:400}}>{h.reply || (h.app.delayAlert && h.app.delayAlert.id===h.id ? 'بانتظار الرد' : 'تحرّكت بدون رد مكتوب')}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function ServiceBuilder({initial, manager, onDone}){
  const {dispatch} = useStore();
  const [d, setD] = useState(()=>({...initial, docs:[...(initial.docs||[])], route:(initial.route||[]).map(r=>({...r}))}));
  const [docInput, setDocInput] = useState('');
  const set = (patch)=>setD(prev=>({...prev, ...patch}));
  const setStage = (i, patch)=>setD(prev=>({...prev, route:prev.route.map((r,j)=>j===i?{...r, ...patch}:r)}));
  const move = (i, dir)=>setD(prev=>{ const r=[...prev.route]; const j=i+dir; if(j<0||j>=r.length) return prev; [r[i],r[j]]=[r[j],r[i]]; return {...prev, route:r}; });
  const removeStage = (i)=>setD(prev=>({...prev, route:prev.route.filter((_,j)=>j!==i)}));
  const addStage = ()=>setD(prev=>({...prev, route:[...prev.route, {department:'eng', label:'', hours:24}]}));
  const addDoc = ()=>{ const v=docInput.trim(); if(v && !d.docs.includes(v)){ set({docs:[...d.docs, v]}); } setDocInput(''); };

  const preview = materializeService(d);
  const errors = [];
  if(!d.name.trim()) errors.push('اسم الخدمة مطلوب.');
  if(d.route.length===0) errors.push('لازم تمر الخدمة بدائرة وحدة على الأقل.');
  if(d.route.some(r=>!(Number(r.hours)>0))) errors.push('كل مرحلة لازم إلها مدة أكبر من صفر.');
  const warnings = [];
  d.route.forEach((r,i)=>{ if(i>0 && d.route[i-1].department===r.department) warnings.push('المرحلتين '+toAr(i+1)+' و'+toAr(i+2)+' بنفس الدائرة — ممكن تدمجيهم.'); });
  if(d.docs.length===0) warnings.push('ما في مستندات مطلوبة — المواطن رح يقدر يقدّم بدون مرفقات.');

  function save(active){
    const {isNew, ...clean} = d;
    dispatch({type:'SAVE_SERVICE', service:{...clean, name:clean.name.trim(), fee:Number(clean.fee)||0, active,
      route:clean.route.map(r=>({department:r.department, label:(r.label||'').trim(), hours:Number(r.hours)})),
      intakeHours:Number(clean.intakeHours)||4, deliveryHours:Number(clean.deliveryHours)||4,
      createdBy:clean.createdBy||manager.name, createdAt:clean.createdAt||Date.now()}});
    onDone();
  }

  return (
    <div>
      <PageHeader onBack={onDone} backLabel="رجوع للخدمات" eyebrow={initial.isNew?'خدمة جديدة':'تعديل خدمة'} title={d.name.trim()||'خدمة بدون اسم'}
        sub="عرّف الخدمة، ثم رتّب الدوائر اللي بتمر فيها المعاملة ومدة كل مرحلة. أول وآخر مرحلة ثابتين لدى خدمات الجمهور."
        actions={<React.Fragment>
          <button className="btn btn-ghost" disabled={errors.length>0} onClick={()=>save(false)}>حفظ كمسودة</button>
          <button className="btn btn-maroon" disabled={errors.length>0} onClick={()=>save(true)}><Icon name="send" size={14}/>نشر الخدمة</button>
        </React.Fragment>}/>

      <div className="layout-split">
        <div className="stack">
          <div className="card card-pad">
            <CardTitle icon="clipboard">بيانات الخدمة</CardTitle>
            <Field label="اسم الخدمة"><input value={d.name} onChange={e=>set({name:e.target.value})} placeholder="مثال: طلب رخصة لافتة تجارية"/></Field>
            <div className="row3">
              <Field label="التصنيف">
                <select value={d.category} onChange={e=>set({category:e.target.value})}>{CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
              </Field>
              <Field label="الرسوم"><input type="number" min="0" value={d.fee} onChange={e=>set({fee:e.target.value})}/></Field>
              <Field label="العملة">
                <select value={d.currency} onChange={e=>set({currency:e.target.value})}><option value="شيكل">شيكل</option><option value="دينار">دينار</option></select>
              </Field>
            </div>
            <Field label="وصف الخدمة للمواطن"><textarea value={d.desc} onChange={e=>set({desc:e.target.value})} placeholder="متى تُقدَّم الخدمة وما الذي تتضمنه..."/></Field>
            <Field label="المستندات المطلوبة">
              <div style={{display:'flex', gap:8}}>
                <input value={docInput} onChange={e=>setDocInput(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); addDoc(); } }} placeholder="اسم المستند ثم Enter"/>
                <button type="button" className="btn btn-outline btn-sm" onClick={addDoc}><Icon name="plus" size={13}/>إضافة</button>
              </div>
              <div style={{display:'flex', flexWrap:'wrap', gap:6, marginTop:10}}>
                {d.docs.map((doc,i)=><span key={i} className="tag">{doc}<button type="button" onClick={()=>set({docs:d.docs.filter((_,j)=>j!==i)})}><Icon name="x" size={12}/></button></span>)}
              </div>
            </Field>
          </div>

          <div className="card card-pad">
            <CardTitle icon="layers" extra={<button className="btn btn-sm btn-outline" onClick={addStage}><Icon name="plus" size={13}/>إضافة مرحلة</button>}>مسار المعاملة داخل البلدية</CardTitle>
            <div className="route-head"><span/><span>الدائرة</span><span>اسم المرحلة (يظهر للمواطن)</span><span>المدة (ساعة)</span><span/></div>
            <div className="route-row locked">
              <div className="route-num"><Icon name="inbox" size={13}/></div>
              <div style={{fontWeight:700, fontSize:13}}>خدمات الجمهور</div>
              <div style={{fontSize:13, color:'var(--ink-soft)'}}>استلام الطلب (ثابتة)</div>
              <input type="number" min="1" value={d.intakeHours} onChange={e=>set({intakeHours:e.target.value})}/>
              <div/>
            </div>
            {d.route.map((r,i)=>(
              <div key={i} className="route-row">
                <div className="route-num">{toAr(i+1)}</div>
                <select value={r.department} onChange={e=>setStage(i,{department:e.target.value})}>
                  {DEPARTMENTS.map(dp=><option key={dp.id} value={dp.id}>{dp.name}</option>)}
                </select>
                <input value={r.label} onChange={e=>setStage(i,{label:e.target.value})} placeholder={STEP_LABELS[r.department]||('معالجة لدى '+deptName(r.department))}/>
                <input type="number" min="1" value={r.hours} onChange={e=>setStage(i,{hours:e.target.value})}/>
                <div className="route-actions">
                  <button className="icon-btn" title="تحريك لأعلى" disabled={i===0} onClick={()=>move(i,-1)}><Icon name="arrowUp" size={14}/></button>
                  <button className="icon-btn" title="تحريك لأسفل" disabled={i===d.route.length-1} onClick={()=>move(i,1)}><Icon name="arrowDown" size={14}/></button>
                  <button className="icon-btn" title="حذف المرحلة" onClick={()=>removeStage(i)}><Icon name="trash" size={14}/></button>
                </div>
              </div>
            ))}
            {d.route.length===0 && <div className="hint-box">أضف دائرة وحدة على الأقل بين الاستلام والتسليم.</div>}
            <div className="route-row locked">
              <div className="route-num"><Icon name="checkCircle" size={13}/></div>
              <div style={{fontWeight:700, fontSize:13}}>خدمات الجمهور</div>
              <div style={{fontSize:13, color:'var(--ink-soft)'}}>تسليم المواطن (ثابتة — يصله إشعار الجاهزية)</div>
              <input type="number" min="1" value={d.deliveryHours} onChange={e=>set({deliveryHours:e.target.value})}/>
              <div/>
            </div>
          </div>
        </div>

        <div className="stack">
          <div className="card card-pad">
            <CardTitle icon="eye">معاينة المسار</CardTitle>
            <div className="timeline">
              {preview.stepChain.map((s,i)=>(
                <div key={i} className={'tl-row '+(i===0?'current':'pending')}>
                  <div className="tl-dot">{toAr(i+1)}</div>
                  <div className="tl-body">
                    <div className="tl-top"><b>{s.citizenLabel}</b></div>
                    <div className="tl-meta">{deptName(s.department)} · {employeeInDept(s.department).name} · {fmtDuration(s.maxDurationHours)}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="card card-pad">
            <CardTitle icon="clock">ملخص</CardTitle>
            <KV k="عدد المراحل" v={toAr(preview.stepChain.length)}/>
            <KV k="المدة الكلية المعلنة" v={preview.durationLabel}/>
            <KV k="الرسوم" v={Number(d.fee)>0?(d.fee+' '+svcCurrency(d.currency)):'مجانية'}/>
            <KV k="المستندات" v={toAr(d.docs.length)}/>
            <KV k="التصعيد التلقائي" v={'بعد '+String(SETTINGS.escalationFactor)+'× مدة المرحلة'}/>
          </div>
          {(errors.length>0 || warnings.length>0) && (
            <div className="card card-pad">
              <CardTitle icon="alert">قبل النشر</CardTitle>
              {errors.map((e,i)=><div key={'e'+i} style={{fontSize:12.5, color:'var(--danger)', fontWeight:700, padding:'3px 0'}}>• {e}</div>)}
              {warnings.map((w,i)=><div key={'w'+i} style={{fontSize:12.5, color:'var(--warning)', padding:'3px 0'}}>• {w}</div>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ManagerNewTransaction({state, manager, simNow, onClose, onCreated}){
  const {dispatch} = useStore();
  const [citizenMode, setCitizenMode] = useState('existing');
  const [citizenId, setCitizenId] = useState(state.citizens[0] ? state.citizens[0].id : '');
  const [newCitizen, setNewCitizen] = useState({name:'', nationalId:'', mobile:'', email:''});
  const [svcMode, setSvcMode] = useState('existing');
  const activeServices = SERVICES.filter(isServiceActive);
  const [svcId, setSvcId] = useState(activeServices[0] ? activeServices[0].id : '');
  const [custom, setCustom] = useState({name:'', category:'certs', desc:'', fee:0, currency:'شيكل', docs:['صورة الهوية'],
    route:[{department:'collections', label:'', hours:24}], intakeHours:4, deliveryHours:4});
  const [docInput, setDocInput] = useState('');
  const selectedCitizen = citizenMode==='existing' ? state.citizens.find(c=>c.id===citizenId) : null;
  const [phone, setPhone] = useState(selectedCitizen ? (selectedCitizen.mobile||'') : '');
  const [email, setEmail] = useState(selectedCitizen ? (selectedCitizen.email||'') : '');
  const [address, setAddress] = useState(selectedCitizen ? {...selectedCitizen.address} : {neighborhood:'', street:'', building:''});
  const [notes, setNotes] = useState('');

  function pickCitizen(id){
    setCitizenId(id);
    const c = state.citizens.find(x=>x.id===id);
    if(c){ setPhone(c.mobile||''); setEmail(c.email||''); setAddress({...c.address}); }
  }

  const setStage = (i, patch)=>setCustom(prev=>({...prev, route:prev.route.map((r,j)=>j===i?{...r, ...patch}:r)}));
  const moveStage = (i, dir)=>setCustom(prev=>{ const r=[...prev.route]; const j=i+dir; if(j<0||j>=r.length) return prev; [r[i],r[j]]=[r[j],r[i]]; return {...prev, route:r}; });
  const removeStage = (i)=>setCustom(prev=>({...prev, route:prev.route.filter((_,j)=>j!==i)}));
  const addStage = ()=>setCustom(prev=>({...prev, route:[...prev.route, {department:'eng', label:'', hours:24}]}));
  const addDoc = ()=>{ const v=docInput.trim(); if(v && !custom.docs.includes(v)) setCustom(prev=>({...prev, docs:[...prev.docs, v]})); setDocInput(''); };

  const preview = svcMode==='custom' ? materializeService(custom) : findService(svcId);

  const errors = [];
  if(citizenMode==='existing' && !selectedCitizen) errors.push('اختر مواطنًا.');
  if(citizenMode==='new' && (!newCitizen.name.trim()||!newCitizen.nationalId.trim()||!newCitizen.mobile.trim())) errors.push('أكمل بيانات المواطن الجديد (الاسم، رقم الهوية، الجوال).');
  if(svcMode==='existing' && !svcId) errors.push('اختر خدمة.');
  if(svcMode==='custom'){
    if(!custom.name.trim()) errors.push('اسم المعاملة مطلوب.');
    if(custom.route.length===0) errors.push('لازم تمر المعاملة بدائرة وحدة على الأقل.');
    if(custom.route.some(r=>!(Number(r.hours)>0))) errors.push('كل مرحلة لازم إلها مدة أكبر من صفر.');
  }
  if(!phone.trim()) errors.push('رقم الهاتف مطلوب.');

  function create(){
    if(errors.length>0) return;
    let finalCitizen = selectedCitizen;
    if(citizenMode==='new'){
      finalCitizen = {id:uid('BTN-2026'), name:newCitizen.name.trim(), nationalId:newCitizen.nationalId.trim(),
        password:'1234', mobile:newCitizen.mobile.trim(), email:(newCitizen.email||'').trim()||'citizen@example.ps', address:{...address}};
      dispatch({type:'ADD_CITIZEN', citizen:finalCitizen});
    }
    let svc = preview;
    if(svcMode==='custom'){
      const defId = uid('svc-custom');
      dispatch({type:'SAVE_SERVICE', service:{id:defId, name:custom.name.trim(), category:custom.category, desc:custom.desc||('معاملة أضافها '+manager.name+'.'),
        fee:Number(custom.fee)||0, currency:custom.currency, docs:custom.docs,
        route:custom.route.map(r=>({department:r.department, label:(r.label||'').trim(), hours:Number(r.hours)})),
        intakeHours:Number(custom.intakeHours)||4, deliveryHours:Number(custom.deliveryHours)||4,
        active:true, createdBy:manager.name, createdAt:Date.now()}});
      svc = materializeService({...custom, id:defId});
    }
    const app = createNewApplication(svc, finalCitizen, phone.trim(), email.trim(), address, notes, {}, simNow);
    dispatch({type:'SUBMIT_NEW_APPLICATION', application:app});
    onCreated(app.id);
  }

  return (
    <div>
      <PageHeader onBack={onClose} backLabel="رجوع" eyebrow="معاملة جديدة" title="إضافة معاملة بالنيابة عن مواطن"
        sub="اختر المواطن، حدّد خدمة موجودة أو ابنِ مسارًا جديدًا بالدوائر التي ستمر فيها بالترتيب، وأنشئ المعاملة مباشرة."
        actions={<button className="btn btn-maroon" disabled={errors.length>0} onClick={create}><Icon name="send" size={14}/>إنشاء المعاملة</button>}/>

      <div className="layout-split">
        <div className="stack">
          <div className="card card-pad">
            <CardTitle icon="user">المواطن</CardTitle>
            <div className="chip-row" style={{marginBottom:14}}>
              <button className={'btn btn-sm '+(citizenMode==='existing'?'btn-maroon':'btn-ghost')} onClick={()=>setCitizenMode('existing')}>مواطن مسجَّل</button>
              <button className={'btn btn-sm '+(citizenMode==='new'?'btn-maroon':'btn-ghost')} onClick={()=>setCitizenMode('new')}>مواطن جديد</button>
            </div>
            {citizenMode==='existing' ? (
              <Field label="اختر المواطن">
                <select value={citizenId} onChange={e=>pickCitizen(e.target.value)}>
                  {state.citizens.map(c=><option key={c.id} value={c.id}>{c.name} — {c.nationalId}</option>)}
                </select>
              </Field>
            ) : (
              <React.Fragment>
                <div className="row2">
                  <Field label="الاسم الكامل"><input value={newCitizen.name} onChange={e=>setNewCitizen({...newCitizen, name:e.target.value})}/></Field>
                  <Field label="رقم الهوية"><input value={newCitizen.nationalId} onChange={e=>setNewCitizen({...newCitizen, nationalId:e.target.value})} dir="ltr"/></Field>
                </div>
                <div className="row2">
                  <Field label="الجوال"><input value={newCitizen.mobile} onChange={e=>{ setNewCitizen({...newCitizen, mobile:e.target.value}); setPhone(e.target.value); }} dir="ltr"/></Field>
                  <Field label="البريد الإلكتروني"><input value={newCitizen.email} onChange={e=>{ setNewCitizen({...newCitizen, email:e.target.value}); setEmail(e.target.value); }} dir="ltr"/></Field>
                </div>
              </React.Fragment>
            )}
          </div>

          <div className="card card-pad">
            <CardTitle icon="layers">الخدمة والمسار</CardTitle>
            <div className="chip-row" style={{marginBottom:14}}>
              <button className={'btn btn-sm '+(svcMode==='existing'?'btn-maroon':'btn-ghost')} onClick={()=>setSvcMode('existing')}>خدمة موجودة</button>
              <button className={'btn btn-sm '+(svcMode==='custom'?'btn-maroon':'btn-ghost')} onClick={()=>setSvcMode('custom')}>مسار جديد مخصص لهذه المعاملة</button>
            </div>
            {svcMode==='existing' ? (
              <Field label="الخدمة">
                <select value={svcId} onChange={e=>setSvcId(e.target.value)}>
                  {activeServices.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </Field>
            ) : (
              <React.Fragment>
                <Field label="اسم المعاملة"><input value={custom.name} onChange={e=>setCustom({...custom, name:e.target.value})} placeholder="مثال: إذن دفن استثنائي"/></Field>
                <div className="row3">
                  <Field label="التصنيف"><select value={custom.category} onChange={e=>setCustom({...custom, category:e.target.value})}>{CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
                  <Field label="الرسوم"><input type="number" min="0" value={custom.fee} onChange={e=>setCustom({...custom, fee:e.target.value})}/></Field>
                  <Field label="العملة"><select value={custom.currency} onChange={e=>setCustom({...custom, currency:e.target.value})}><option value="شيكل">شيكل</option><option value="دينار">دينار</option></select></Field>
                </div>
                <Field label="المستندات المطلوبة (اختياري)">
                  <div style={{display:'flex', gap:8}}>
                    <input value={docInput} onChange={e=>setDocInput(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); addDoc(); } }} placeholder="اسم المستند ثم Enter"/>
                    <button type="button" className="btn btn-outline btn-sm" onClick={addDoc}><Icon name="plus" size={13}/>إضافة</button>
                  </div>
                  <div style={{display:'flex', flexWrap:'wrap', gap:6, marginTop:10}}>
                    {custom.docs.map((doc,i)=><span key={i} className="tag">{doc}<button type="button" onClick={()=>setCustom({...custom, docs:custom.docs.filter((_,j)=>j!==i)})}><Icon name="x" size={12}/></button></span>)}
                  </div>
                </Field>
                <div className="route-head"><span/><span>الدائرة</span><span>اسم المرحلة (يظهر للمواطن)</span><span>المدة (ساعة)</span><span/></div>
                <div className="route-row locked">
                  <div className="route-num"><Icon name="inbox" size={13}/></div>
                  <div style={{fontWeight:700, fontSize:13}}>خدمات الجمهور</div>
                  <div style={{fontSize:13, color:'var(--ink-soft)'}}>استلام الطلب (ثابتة)</div>
                  <input type="number" min="1" value={custom.intakeHours} onChange={e=>setCustom({...custom, intakeHours:e.target.value})}/>
                  <div/>
                </div>
                {custom.route.map((r,i)=>(
                  <div key={i} className="route-row">
                    <div className="route-num">{toAr(i+1)}</div>
                    <select value={r.department} onChange={e=>setStage(i,{department:e.target.value})}>
                      {DEPARTMENTS.filter(d=>d.id!=='pubserv'&&d.id!=='mgmt').map(dp=><option key={dp.id} value={dp.id}>{dp.name}</option>)}
                    </select>
                    <input value={r.label} onChange={e=>setStage(i,{label:e.target.value})} placeholder={STEP_LABELS[r.department]||('معالجة لدى '+deptName(r.department))}/>
                    <input type="number" min="1" value={r.hours} onChange={e=>setStage(i,{hours:e.target.value})}/>
                    <div className="route-actions">
                      <button className="icon-btn" title="تحريك لأعلى" disabled={i===0} onClick={()=>moveStage(i,-1)}><Icon name="arrowUp" size={14}/></button>
                      <button className="icon-btn" title="تحريك لأسفل" disabled={i===custom.route.length-1} onClick={()=>moveStage(i,1)}><Icon name="arrowDown" size={14}/></button>
                      <button className="icon-btn" title="حذف المرحلة" onClick={()=>removeStage(i)}><Icon name="trash" size={14}/></button>
                    </div>
                  </div>
                ))}
                <div className="route-row locked">
                  <div className="route-num"><Icon name="checkCircle" size={13}/></div>
                  <div style={{fontWeight:700, fontSize:13}}>خدمات الجمهور</div>
                  <div style={{fontSize:13, color:'var(--ink-soft)'}}>تسليم المواطن (ثابتة — يصله إشعار الجاهزية)</div>
                  <input type="number" min="1" value={custom.deliveryHours} onChange={e=>setCustom({...custom, deliveryHours:e.target.value})}/>
                  <div/>
                </div>
                <button type="button" className="btn btn-sm btn-outline" style={{marginTop:4}} onClick={addStage}><Icon name="plus" size={13}/>إضافة مرحلة</button>
              </React.Fragment>
            )}
          </div>

          <div className="card card-pad">
            <CardTitle icon="phone">بيانات التواصل لهذه المعاملة</CardTitle>
            <div className="row2">
              <Field label="رقم الهاتف"><input value={phone} onChange={e=>setPhone(e.target.value)} dir="ltr"/></Field>
              <Field label="البريد الإلكتروني"><input value={email} onChange={e=>setEmail(e.target.value)} dir="ltr"/></Field>
            </div>
            <div className="row3">
              <Field label="الحي"><input value={address.neighborhood||''} onChange={e=>setAddress({...address, neighborhood:e.target.value})}/></Field>
              <Field label="الشارع"><input value={address.street||''} onChange={e=>setAddress({...address, street:e.target.value})}/></Field>
              <Field label="البناء"><input value={address.building||''} onChange={e=>setAddress({...address, building:e.target.value})}/></Field>
            </div>
            <Field label="ملاحظات (اختياري)"><textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="أي تفاصيل إضافية عن سبب إنشاء المعاملة يدويًا..."/></Field>
          </div>
        </div>

        <div className="stack">
          <div className="card card-pad">
            <CardTitle icon="eye">معاينة المسار</CardTitle>
            {preview ? (
              <div className="timeline">
                {preview.stepChain.map((s,i)=>(
                  <div key={i} className={'tl-row '+(i===0?'current':'pending')}>
                    <div className="tl-dot">{toAr(i+1)}</div>
                    <div className="tl-body">
                      <div className="tl-top"><b>{s.citizenLabel}</b></div>
                      <div className="tl-meta">{deptName(s.department)} · {employeeInDept(s.department).name} · {fmtDuration(s.maxDurationHours)}</div>
                    </div>
                  </div>
                ))}
              </div>
            ) : <div style={{fontSize:12.5, color:'var(--muted)'}}>اختر خدمة لعرض مسارها.</div>}
          </div>
          <div className="card card-pad">
            <CardTitle icon="clipboard">ملخص</CardTitle>
            <KV k="المواطن" v={citizenMode==='existing' ? (selectedCitizen?selectedCitizen.name:'—') : (newCitizen.name.trim()||'—')}/>
            <KV k="الخدمة" v={preview?preview.name:'—'}/>
            <KV k="عدد المراحل" v={preview?toAr(preview.stepChain.length):'—'}/>
            <KV k="المدة الكلية" v={preview?preview.durationLabel:'—'}/>
            <KV k="الرسوم" v={preview?(Number(preview.fee)>0?(preview.fee+' '+svcCurrency(preview.currency)):'مجانية'):'—'}/>
          </div>
          {errors.length>0 && (
            <div className="card card-pad">
              <CardTitle icon="alert">قبل الإنشاء</CardTitle>
              {errors.map((e,i)=><div key={i} style={{fontSize:12.5, color:'var(--danger)', fontWeight:700, padding:'3px 0'}}>• {e}</div>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ManagerReports({state, simNow}){
  const apps = state.applications;
  const delivered = apps.filter(a=>a.status==='delivered');
  const doneStages = []; apps.forEach(a=>a.stages.forEach(s=>{ if(s.status==='done' && s.startedAt && s.endedAt) doneStages.push({h:(s.endedAt-s.startedAt)/HOUR, max:s.maxDurationHours}); }));
  const slaPct = doneStages.length ? Math.round(doneStages.filter(x=>x.h<=x.max).length/doneStages.length*100) : null;
  const completionH = delivered.map(a=>{ const end = a.deliveredAt || a.stages[a.stages.length-1].endedAt; return end ? (end-a.submittedAt)/HOUR : null; }).filter(x=>x!=null);
  const avgCompletion = completionH.length ? completionH.reduce((a,b)=>a+b,0)/completionH.length : null;
  const pauses = []; apps.forEach(a=>a.stages.forEach(s=>{ (s.pauseLog||(s.pauseReason?[{reason:s.pauseReason, at:s.pausedAt}]:[])).forEach(p=>pauses.push({...p, dept:s.department, app:a})); }));
  pauses.sort((x,y)=>(y.at||0)-(x.at||0));
  const rated = apps.filter(a=>a.rated);
  const avgRating = rated.length ? (rated.reduce((a,b)=>a+b.rating,0)/rated.length) : null;
  const bySvc = {};
  apps.forEach(a=>{ const k=a.serviceId; bySvc[k] = bySvc[k] || {total:0, active:0, delivered:0, overdue:0}; bySvc[k].total++; if(a.status==='delivered') bySvc[k].delivered++; else bySvc[k].active++; if(isStageOverdue(a,simNow)) bySvc[k].overdue++; });

  function exportCsv(){
    const head = ['رقم المعاملة','الخدمة','المواطن','الحالة','الدائرة الحالية','تاريخ التقديم','متأخرة','حالة التنبيه'];
    const rows = apps.map(a=>{
      const st = a.stages[activeStageIndex(a)]; const c = state.citizens.find(x=>x.id===a.citizenId);
      return [a.reqNumber, svcName(a.serviceId), c?c.name:'', isReadyForPickup(a)?'جاهزة للاستلام':(STATUS[a.status]||{}).label, st?deptName(st.department):'—', fmtDateTime(a.submittedAt), isStageOverdue(a,simNow)?'نعم':'لا', alertState(a)];
    });
    const csv = '\uFEFF'+[head, ...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const link = document.createElement('a'); link.href=url; link.download='tarf-al-khayt-report.csv'; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  return (
    <div>
      <PageHeader title="التقارير" sub="مؤشرات الأداء على مستوى البلدية — محسوبة مباشرة من سجل المسار."
        actions={<button className="btn btn-outline" onClick={exportCsv}><Icon name="download" size={14}/>تصدير CSV</button>}/>
      <div className="grid grid-4" style={{marginBottom:18}}>
        <div className="stat-tile"><div className="num">{slaPct!=null?toAr(slaPct)+'٪':'—'}</div><div className="lbl"><Icon name="clock" size={13}/>مراحل أُنجزت ضمن المدة</div></div>
        <div className="stat-tile"><div className="num">{avgCompletion!=null?fmtDuration(avgCompletion):'—'}</div><div className="lbl"><Icon name="checkCircle" size={13}/>متوسط إنجاز المعاملة</div></div>
        <div className="stat-tile"><div className="num">{toAr(pauses.length)}</div><div className="lbl"><Icon name="pause" size={13}/>توقفات موثّقة بسبب</div></div>
        <div className="stat-tile"><div className="num">{avgRating!=null?avgRating.toFixed(1)+' / ٥':'—'}</div><div className="lbl"><Icon name="star" size={13}/>رضا المواطنين ({toAr(rated.length)} تقييم)</div></div>
      </div>
      <div className="layout-split">
        <div className="card card-pad">
          <CardTitle icon="layers">حسب الخدمة</CardTitle>
          <div className="table-wrap">
            <table className="table">
              <thead><tr><th>الخدمة</th><th>الإجمالي</th><th>نشطة</th><th>مكتملة</th><th>متأخرة</th></tr></thead>
              <tbody>
                {Object.entries(bySvc).sort((a,b)=>b[1].total-a[1].total).map(([id,v])=>(
                  <tr key={id}>
                    <td style={{fontWeight:700}}>{svcName(id)}</td><td>{toAr(v.total)}</td><td>{toAr(v.active)}</td>
                    <td style={{color:'var(--success)'}}>{toAr(v.delivered)}</td>
                    <td style={{color:v.overdue?'var(--danger)':'inherit', fontWeight:v.overdue?800:400}}>{toAr(v.overdue)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        <div className="card card-pad">
          <CardTitle icon="pause">آخر أسباب التوقف</CardTitle>
          {pauses.length===0 ? <div style={{fontSize:12.5, color:'var(--muted)'}}>لا توجد توقفات.</div> : pauses.slice(0,6).map((p,i)=>(
            <div key={i} className="kv" style={{display:'block'}}>
              <div style={{fontSize:12.5}}>{p.reason}</div>
              <div className="muted" style={{fontSize:11}}>{deptName(p.dept)} · {svcName(p.app.serviceId)}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

        <div className="card card-pad">
          <CardTitle icon="settings">بيانات العرض التجريبي</CardTitle>
          <div style={{fontSize:12.5, color:'var(--ink-soft)', marginBottom:12}}>ترجع كل المعاملات والإشعارات والخدمات المضافة والساعة الافتراضية لحالة البداية — مفيدة قبل العرض أمام اللجنة.</div>
          {!confirmReset ? <button className="btn btn-outline btn-sm" onClick={()=>setConfirmReset(true)}>إعادة ضبط بيانات العرض</button> : (
            <div style={{display:'flex', gap:8}}>
              <button className="btn btn-danger btn-sm" onClick={()=>{ dispatch({type:'RESET_DEMO'}); setConfirmReset(false); }}>تأكيد إعادة الضبط</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>setConfirmReset(false)}>إلغاء</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


// ===================== ROOT =====================
function syncSignature(x){
  return JSON.stringify([x.applications, x.simOffset, x.customServices||[], x.notifications||[], x.settings||{}]);
}
function App(){
  const [state, dispatch] = useReducer(reducer, initialState);
  const skipBroadcastRef = useRef(false);
  const remoteRef = useRef(false);
  const stateRef = useRef(state);
  const mountedRef = useRef(false);
  stateRef.current = state;
  // الخدمات المضافة والإعدادات لازم تكون مطبّقة قبل ما ترسم أي شاشة
  applyCustomServices(state.customServices);
  applySettings(state.settings);

  // receive updates from other tabs — BroadcastChannel (instant) + storage event (fallback)
  useEffect(()=>{
    function applyRemote(payload){
      if(!payload || payload.schema!==SYNC_SCHEMA || !Array.isArray(payload.applications)) return;
      applyCustomServices(payload.customServices||[]);
      if(!payload.applications.every(isValidApplication)) return;
      // نفس الرسالة بتوصل مرتين (BroadcastChannel + storage) — نتجاهل النسخة المكررة
      const cur = stateRef.current;
      if(syncSignature(payload)===syncSignature(cur)) return;
      skipBroadcastRef.current = true;
      remoteRef.current = true;
      dispatch({type:'SYNC_APPLY', payload});
    }
    function onMessage(e){ applyRemote(e.data); }
    function onStorage(e){
      if(e.key!==SYNC_KEY || !e.newValue) return;
      try{ applyRemote(JSON.parse(e.newValue)); }catch(err){}
    }
    if(syncChannel) syncChannel.addEventListener('message', onMessage);
    window.addEventListener('storage', onStorage);
    return ()=>{ if(syncChannel) syncChannel.removeEventListener('message', onMessage); window.removeEventListener('storage', onStorage); };
  },[]);

  // كشف التأخير والتصعيد تلقائيًا (بالتبويب اللي صار فيه التغيير فقط — عشان ما يتكرر الإشعار)
  useEffect(()=>{
    if(remoteRef.current) return;
    const simNow = Date.now()+state.simOffset;
    const items = [];
    state.applications.forEach(a=>{
      const idx = activeStageIndex(a);
      if(idx<0) return;
      if(isStageOverdue(a, simNow) && a.overdueFlag!==idx) items.push({appId:a.id, kind:'overdue'});
      else if(isStageEscalated(a, simNow) && a.escalatedFlag!==idx) items.push({appId:a.id, kind:'escalated'});
    });
    if(items.length) dispatch({type:'MARK_OVERDUE', items});
  }, [state.applications, state.simOffset, state.settings]);

  // publish local changes to other tabs
  useEffect(()=>{
    if(skipBroadcastRef.current){ skipBroadcastRef.current=false; remoteRef.current=false; return; }
    const payload = {schema:SYNC_SCHEMA, applications:state.applications, simOffset:state.simOffset,
      customServices:state.customServices, notifications:state.notifications, settings:state.settings};
    try{ localStorage.setItem(SYNC_KEY, JSON.stringify(payload)); }catch(e){}
    if(!mountedRef.current){ mountedRef.current = true; return; } // فتح تبويب جديد ما لازم يزعج باقي التبويبات
    if(syncChannel) syncChannel.postMessage(payload);
  }, [state.applications, state.simOffset, state.customServices, state.notifications, state.settings]);

  const employee = state.auth.userType==='employee' ? EMPLOYEES.find(e=>e.id===state.auth.userId) : null;
  const isManager = !!(employee && employee.permission==='manager');

  let body;
  if(!state.auth.loggedIn){
    body = <AuthGate/>;
  } else {
    body = (
      <React.Fragment>
        <Header/>
        {state.auth.userType==='citizen' && <CitizenApp/>}
        {state.auth.userType==='employee' && (isManager ? <ManagerApp/> : <EmployeeApp/>)}
      </React.Fragment>
    );
  }

  return (
    <StoreCtx.Provider value={{state, dispatch}}>
      <div className="app-shell">
        {body}
        <Toast/>
      </div>
    </StoreCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
